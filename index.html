// THEME APPLICATION (one function, sets both palette vars + wallpaper)
// ════════════════════════════════════════════════════════════════════
function applyTheme(id){
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  const r = document.documentElement.style;
  for (const [k, v] of Object.entries(t.colors)){
    r.setProperty('--' + k.toLowerCase(), v);
  }
  r.setProperty('--wallpaper', t.wallpaper);
  r.setProperty('--tile-bg', `color-mix(in srgb, ${t.colors.PANEL} 70%, ${t.colors.BODY})`);
  const desk = document.getElementById('desktop');
  if (desk) desk.classList.toggle('wp-light', t.mood === 'light');
  state.theme = t.id;
  localStorage.setItem(LS_KEY.theme, t.id);
  fsScheduleStateWrite();
  // Update any open iframe windows so apps that listen can re-theme
  document.querySelectorAll('.nw-window iframe').forEach(f => {
    try { f.contentWindow.postMessage({ type:'naklios:theme', theme:t.id, colors:t.colors, mood:t.mood }, '*'); } catch(_){}
  });
}

// ════════════════════════════════════════════════════════════════════
// ICON GRID
// ════════════════════════════════════════════════════════════════════
const ICON_W = 104, ICON_H = 124; // grid cell (with label below)
const GRID_PAD = 24;

// Items shown on the main desktop: classics first, then folders, then any
// ungrouped non-classic apps (defensive — should be empty if FOLDERS covers all).
function getDesktopItems(){
  const items = [];
  for (const app of APPS) if (app.kind === 'classic') items.push(app);
  for (const folder of FOLDERS) items.push(folder);
  for (const app of APPS){
    if (app.kind === 'classic') continue;
    if (isInFolder(app.id)) continue; // dynamic — respects state.layout.unfoldered
    items.push(app);
  }
  return items;
}

function getGridDims(){
  const area = document.getElementById('icon-area').getBoundingClientRect();
  return {
    cols: Math.max(1, Math.floor((area.width  - GRID_PAD*2) / ICON_W)),
    rows: Math.max(1, Math.floor((area.height - GRID_PAD*2) / ICON_H)),
  };
}

function computeAutoPositions(){
  // Two-pass column-major placement: left-aligned items fill from x=0 rightward,
  // right-aligned items (desktopAlign:'right') fill from x=cols-1 leftward,
  // sorted by desktopOrder so we control top-to-bottom rank.
  const { cols, rows } = getGridDims();
  const used = new Set();
  for (const [id, pos] of Object.entries(state.layout.positions || {})){
    used.add(`${pos.x},${pos.y}`);
  }
  const result = {};
  const items = getDesktopItems().filter(it =>
    !(state.layout.hidden && state.layout.hidden.includes(it.id))
  );
  const rightItems = items
    .filter(it => it.desktopAlign === 'right')
    .sort((a, b) => (a.desktopOrder ?? 99) - (b.desktopOrder ?? 99));
  const leftItems = items.filter(it => it.desktopAlign !== 'right');

  // Reserve the rightmost column for right items when both kinds exist.
  const leftMaxCol = (rightItems.length > 0 && cols > 1) ? cols - 2 : cols - 1;

  for (const item of leftItems){
    if (state.layout.positions[item.id]) { result[item.id] = state.layout.positions[item.id]; continue; }
    outer: for (let x = 0; x <= leftMaxCol; x++){
      for (let y = 0; y < rows; y++){
        const k = `${x},${y}`;
        if (!used.has(k)) { used.add(k); result[item.id] = {x, y}; break outer; }
      }
    }
    if (!result[item.id]) result[item.id] = {x:0, y:0};
  }

  for (const item of rightItems){
    if (state.layout.positions[item.id]) { result[item.id] = state.layout.positions[item.id]; continue; }
    outer: for (let x = cols - 1; x >= 0; x--){
      for (let y = 0; y < rows; y++){
        const k = `${x},${y}`;
        if (!used.has(k)) { used.add(k); result[item.id] = {x, y}; break outer; }
      }
    }
    if (!result[item.id]) result[item.id] = {x:0, y:0};
  }
  return result;
}

function renderIcons(){
  const area = document.getElementById('icon-area');
  area.innerHTML = '';
  const mobile = isMobile();
  document.body.classList.toggle('is-mobile', mobile);
  const positions = mobile ? null : computeAutoPositions();

  let list = getDesktopItems();
  if (mobile){
    const pos = state.layout.positions || {};
    list = list.slice().sort((a, b) => {
      const pa = pos[a.id] || {x:99, y:99};
      const pb = pos[b.id] || {x:99, y:99};
      if (pa.y !== pb.y) return pa.y - pb.y;
      return pa.x - pb.x;
    });
  }

  for (const item of list){
    if (state.layout.hidden && state.layout.hidden.includes(item.id)) continue;
    const isFolder = item.kind === 'folder';
    const el = document.createElement('button');
    el.className = 'nw-icon' + (isFolder ? ' is-folder' : '');
    if (item.private) el.classList.add('private');
    el.dataset.id = item.id;
    el.setAttribute('aria-label', isFolder ? `${item.name} folder` : item.name);
    el.title = isFolder
      ? `${item.name} folder · ${item.apps.length} apps`
      : (item.description ? `${item.name} — ${item.description}` : item.name);
    const bgVar = item.bg || 'brand';
    const bgColor = `color-mix(in srgb, var(--${bgVar}) 22%, var(--panel))`;
    const monoChar = (item.name || '?').charAt(0).toUpperCase();
    // For folders, build a 2×2 mini-preview from the first 4 contained apps' glyphs
    const previewHTML = isFolder
      ? `<div class="nw-folder-mini">${item.apps.slice(0,4).map(aid => {
            const a = APPS.find(x => x.id === aid);
            if (a?.svg) return `<span><svg class="nw-icon-svg" viewBox="0 0 24 24" aria-hidden="true">${a.svg}</svg></span>`;
            return `<span>${a?.glyph || '·'}</span>`;
          }).join('')}</div>`
      : item.svg
        ? `<svg class="nw-icon-svg" viewBox="0 0 24 24" aria-hidden="true">${item.svg}</svg>`
        : `<span class="nw-icon-glyph">${item.glyph || monoChar}</span>`;
    el.innerHTML = `
      <div class="nw-icon-tile ${item.glyph ? 'has-glyph' : ''}" style="background:${bgColor}; border-color:color-mix(in srgb, var(--${bgVar}) 30%, var(--line));">
        ${previewHTML}
      </div>
      <div class="nw-icon-label">${item.name}</div>
    `;
    if (!mobile && positions[item.id]){
      const p = positions[item.id];
      el.style.left = (GRID_PAD + p.x * ICON_W) + 'px';
      el.style.top = (GRID_PAD + p.y * ICON_H) + 'px';
    }
    el.addEventListener('click', () => {
      if (el._wasDragged) { el._wasDragged = false; return; }
      if (isFolder) openFolder(item);
      else openApp(item);
    });
    el.addEventListener('contextmenu', e => {
      e.preventDefault();
      const menuItems = [
        { label: isPinned(item.id) ? 'Unpin from dock' : 'Pin to dock',
          onClick: () => isPinned(item.id) ? unpinItem(item.id) : pinItem(item.id) },
      ];
      if (!isFolder && (state.layout.unfoldered || []).includes(item.id)){
        menuItems.push({ separator:true });
        menuItems.push({ label: 'Move back into its folder', onClick: () => {
          state.layout.unfoldered = (state.layout.unfoldered || []).filter(x => x !== item.id);
          delete state.layout.positions[item.id];
          saveLayout();
          renderIcons();
        }});
      }
      showContextMenu(e.clientX, e.clientY, menuItems);
    });
    if (!mobile) makeIconDraggable(el, item);
    area.appendChild(el);
  }
  renderStickies();
}

function makeIconDraggable(el, app){
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const origLeft = parseFloat(el.style.left) || 0;
    const origTop = parseFloat(el.style.top) || 0;
    let dragging = false;
    let hoverFolderEl = null;
    let hoverFolderTimer = null;
    let absorbed = false;

    function overDock(ev){
      const dock = document.getElementById('nw-dock');
      if (!dock) return false;
      const r = dock.getBoundingClientRect();
      return ev.clientX >= r.left - 12 && ev.clientX <= r.right + 12
          && ev.clientY >= r.top - 12 && ev.clientY <= r.bottom + 12;
    }
    function findFolderUnder(ev){
      if (app.kind === 'folder') return null; // can't drop a folder into a folder
      const els = document.elementsFromPoint(ev.clientX, ev.clientY);
      return els.find(e => e !== el && e.classList?.contains('nw-icon') && e.classList.contains('is-folder')) || null;
    }
    function clearHoverFolder(){
      if (hoverFolderTimer) { clearTimeout(hoverFolderTimer); hoverFolderTimer = null; }
      hoverFolderEl?.classList.remove('is-drop-target');
      hoverFolderEl = null;
    }
    function absorbIntoFolder(folderEl){
      const folderId = folderEl.dataset.id;
      const folder = FOLDERS.find(f => f.id === folderId);
      if (!folder || folder.apps.includes(app.id)) return;
      folder.apps.push(app.id);
      state.layout.unfoldered = (state.layout.unfoldered || []).filter(x => x !== app.id);
      delete state.layout.positions[app.id];
      saveLayout();
      absorbed = true;
      el.remove();
      renderIcons();
    }

    const onMove = ev => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (!dragging && Math.hypot(dx, dy) > 4) {
        dragging = true; el.classList.add('dragging');
      }
      if (dragging){
        el.style.left = (origLeft + dx) + 'px';
        el.style.top = (origTop + dy) + 'px';
        const dock = document.getElementById('nw-dock');
        if (dock) dock.classList.toggle('is-drop-target', overDock(ev));
        // Hover-over-folder: 500ms dwell => absorb the dragged app.
        const folderEl = findFolderUnder(ev);
        if (folderEl !== hoverFolderEl){
          clearHoverFolder();
          if (folderEl){
            hoverFolderEl = folderEl;
            folderEl.classList.add('is-drop-target');
            hoverFolderTimer = setTimeout(() => absorbIntoFolder(folderEl), 500);
          }
        }
      }
    };
    const onUp = ev => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      document.getElementById('nw-dock')?.classList.remove('is-drop-target');
      if (absorbed) return;
      // Release while hovering a folder also absorbs (no need to wait the 500ms).
      const folderUnder = dragging ? findFolderUnder(ev) : null;
      clearHoverFolder();
      if (folderUnder){
        el.classList.remove('dragging');
        el._wasDragged = true;
        absorbIntoFolder(folderUnder);
        setTimeout(() => { el._wasDragged = false; }, 50);
        return;
      }
      if (!dragging) return;
      el.classList.remove('dragging');
      el._wasDragged = true;
      if (overDock(ev) && app.kind !== 'folder'){
        // Pin to dock; restore icon to its original grid position
        el.style.left = (GRID_PAD + (state.layout.positions[app.id]?.x ?? 0) * ICON_W) + 'px';
        el.style.top = (GRID_PAD + (state.layout.positions[app.id]?.y ?? 0) * ICON_H) + 'px';
        pinItem(app.id);
      } else if (overDock(ev)){
        // Folder dropped on dock: folders can't be pinned, so snap back to origin.
        el.style.left = origLeft + 'px';
        el.style.top = origTop + 'px';
      } else {
        // Snap to grid; if a different icon already sits at the target cell, swap them.
        // Clamp to bounds so dragging off-screen doesn't lose the icon or trigger a scrollbar.
        const { cols, rows } = getGridDims();
        const x = Math.max(0, Math.min(cols - 1, Math.round((parseFloat(el.style.left) - GRID_PAD) / ICON_W)));
        const y = Math.max(0, Math.min(rows - 1, Math.round((parseFloat(el.style.top) - GRID_PAD) / ICON_H)));
        const origX = Math.round((origLeft - GRID_PAD) / ICON_W);
        const origY = Math.round((origTop - GRID_PAD) / ICON_H);
        let displaced = null;
        document.querySelectorAll('#icon-area .nw-icon').forEach(other => {
          if (other === el) return;
          const ox = Math.round((parseFloat(other.style.left) - GRID_PAD) / ICON_W);
          const oy = Math.round((parseFloat(other.style.top) - GRID_PAD) / ICON_H);
          if (ox === x && oy === y) displaced = other;
        });
        if (displaced){
          state.layout.positions[displaced.dataset.id] = { x: origX, y: origY };
          displaced.style.left = (GRID_PAD + origX * ICON_W) + 'px';
          displaced.style.top = (GRID_PAD + origY * ICON_H) + 'px';
        }
        el.style.left = (GRID_PAD + x * ICON_W) + 'px';
        el.style.top = (GRID_PAD + y * ICON_H) + 'px';
        state.layout.positions[app.id] = {x, y};
        saveLayout();
      }
      setTimeout(() => { el._wasDragged = false; }, 50);
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

// ════════════════════════════════════════════════════════════════════
// WINDOW MANAGER
// ════════════════════════════════════════════════════════════════════
let topZ = 100;
const openWindows = Object.create(null);
const knownIframes = new Set();

function makeWindow(opts){
  const { id, title, width=520, height=420, badge, sandboxed } = opts;
  if (openWindows[id]) { focusWindow(openWindows[id]); return openWindows[id]; }
  const root = document.getElementById('overlay-root');
  const win = document.createElement('div');
  win.className = 'nw-window';
  win.dataset.id = id;
  win.style.width = width + 'px';
  win.style.height = height + 'px';
  // Restore saved position if it exists and is at least partially in-viewport;
  // otherwise fall back to centered placement with cascading offset.
  const saved = state.layout.windowPositions[id];
  const area = document.getElementById('icon-grid').getBoundingClientRect();
  let px, py;
  if (saved && typeof saved.x === 'number' && typeof saved.y === 'number'
      && saved.x > -width + 80 && saved.x < innerWidth - 80
      && saved.y > 40 && saved.y < innerHeight - 40){
    px = saved.x;
    py = saved.y;
  } else {
    const offset = (Object.keys(openWindows).length % 8) * 24;
    px = Math.max(20, (area.width - width) / 2 + offset);
    py = Math.max(area.top + 20, (area.height - height) / 2 - 40 + offset + area.top);
  }
  win.style.left = px + 'px';
  win.style.top = py + 'px';
  win.innerHTML = `
    <div class="nw-titlebar">
      ${sandboxed ? `<span class="nw-title-sandbox" title="Runs in an isolated origin. nakliOS can't read its data, and it can't reach back into nakliOS.">🔒 sandboxed</span>` : ''}
      ${badge ? `<span class="nw-title-badge">${badge}</span>` : ''}
      <span class="nw-title">${title}</span>
      <button class="nw-min-btn" title="Minimize (click dock to restore)" aria-label="Minimize">—</button>
      <button class="nw-fs-btn" title="Maximize / restore (Esc to exit)" aria-label="Maximize">⛶</button>
      <button class="nw-close" aria-label="Close">✕</button>
    </div>
    <div class="nw-body"></div>
  `;
  root.appendChild(win);
  openWindows[id] = win;
  win.addEventListener('pointerdown', () => focusWindow(win));
  win.querySelector('.nw-close').addEventListener('click', e => {
    e.stopPropagation(); closeWindow(win);
  });
  win.querySelector('.nw-fs-btn').addEventListener('click', e => {
    e.stopPropagation(); toggleFullscreen(win);
  });
  win.querySelector('.nw-min-btn').addEventListener('click', e => {
    e.stopPropagation(); minimizeWindow(win);
  });
  makeDraggable(win);
  focusWindow(win);
  return win;
}

let fullscreenWin = null;
let fullscreenSaved = null;

function toggleFullscreen(win){
  if (fullscreenWin === win){
    // restore
    if (fullscreenSaved){
      win.style.left = fullscreenSaved.left;
      win.style.top = fullscreenSaved.top;
      win.style.width = fullscreenSaved.width;
      win.style.height = fullscreenSaved.height;
    }
    win.classList.remove('is-fullscreen');
    win.querySelector('.nw-fs-btn').textContent = '⛶';
    fullscreenWin = null;
    fullscreenSaved = null;
  } else {
    if (fullscreenWin) toggleFullscreen(fullscreenWin);
    fullscreenSaved = {
      left: win.style.left,
      top: win.style.top,
      width: win.style.width,
      height: win.style.height,
    };
    const grid = document.getElementById('icon-grid').getBoundingClientRect();
    win.style.left = grid.left + 'px';
    win.style.top = grid.top + 'px';
    win.style.width = grid.width + 'px';
    win.style.height = grid.height + 'px';
    win.classList.add('is-fullscreen');
    win.querySelector('.nw-fs-btn').textContent = '⊟';
    fullscreenWin = win;
    focusWindow(win);
  }
}

function updateDock(){
  const dock = document.getElementById('nw-dock');
  if (!dock) return;
  // identify which window is on top by z-index (skip minimized)
  let topId = null, topZval = -1;
  for (const [id, w] of Object.entries(openWindows)){
    if (w.classList.contains('is-minimized')) continue;
    const z = parseInt(w.style.zIndex, 10) || 0;
    if (z > topZval){ topZval = z; topId = id; }
  }
  dock.innerHTML = '';

  const pinned = state.layout.pinned || [];
  // Helper: find the icon source (app or folder) by id
  const findIcon = (id) => APPS.find(a => a.id === id) || FOLDERS.find(f => f.id === id);

  // Build sequence: pinned items first, then any running windows that aren't pinned
  const sequence = [];
  for (const id of pinned){
    const icon = findIcon(id);
    if (!icon) continue;
    sequence.push({ id, icon, pinned:true, open: !!openWindows[id] });
  }
  let addedSep = false;
  for (const id of Object.keys(openWindows)){
    if (pinned.includes(id)) continue;
    const icon = findIcon(id);
    if (!icon) continue;
    if (!addedSep && sequence.length){
      sequence.push({ separator:true });
      addedSep = true;
    }
    sequence.push({ id, icon, pinned:false, open:true });
  }

  for (const it of sequence){
    if (it.separator){
      const sep = document.createElement('div');
      sep.className = 'nw-dock-sep';
      dock.appendChild(sep);
      continue;
    }
    const w = openWindows[it.id];
    const isFolder = it.icon.kind === 'folder';
    const btn = document.createElement('button');
    btn.className = 'nw-dock-item'
      + (it.id === topId ? ' is-active' : '')
      + (it.open ? ' is-open' : '');
    btn.title = it.icon.name + (it.pinned ? '  ·  pinned' : '');
    btn.dataset.appId = it.id;
    btn.innerHTML = it.icon.svg
      ? `<svg class="nw-icon-svg nw-dock-item-svg" viewBox="0 0 24 24" aria-hidden="true">${it.icon.svg}</svg>`
      : `<span class="nw-dock-item-glyph">${it.icon.glyph || it.icon.name.charAt(0)}</span>`;
    btn.addEventListener('click', () => {
      if (btn._wasDragged) { btn._wasDragged = false; return; }
      if (w){
        if (fullscreenWin && fullscreenWin !== w) toggleFullscreen(fullscreenWin);
        focusWindow(w);
      } else if (isFolder){
        openFolder(it.icon);
      } else {
        openApp(it.icon);
      }
    });
    btn.addEventListener('contextmenu', e => {
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, [
        { label: it.pinned ? 'Unpin from dock' : 'Pin to dock',
          onClick: () => it.pinned ? unpinItem(it.id) : pinItem(it.id) },
      ]);
    });
    if (it.pinned){
      btn.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        const startX = e.clientX;
        let dragging = false;
        const onMove = ev => {
          if (!dragging && Math.abs(ev.clientX - startX) > 5){
            dragging = true;
            btn.style.opacity = '0.5';
            btn.style.transition = 'none';
          }
          if (dragging) btn.style.transform = `translateX(${ev.clientX - startX}px)`;
        };
        const onUp = ev => {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          btn.style.transform = '';
          btn.style.opacity = '';
          btn.style.transition = '';
          if (!dragging) return;
          btn._wasDragged = true;
          const target = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.nw-dock-item');
          if (target && target !== btn && target.dataset.appId && (state.layout.pinned || []).includes(target.dataset.appId)){
            const fromId = it.id;
            const toId = target.dataset.appId;
            const pinned = (state.layout.pinned || []).filter(x => x !== fromId);
            const targetIdx = pinned.indexOf(toId);
            if (targetIdx >= 0){
              pinned.splice(targetIdx, 0, fromId);
              state.layout.pinned = pinned;
              saveLayout();
              updateDock();
            }
          }
          setTimeout(() => { btn._wasDragged = false; }, 50);
        };
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    }
    dock.appendChild(btn);
  }
}

function focusWindow(win){
  if (win.classList.contains('is-minimized')) win.classList.remove('is-minimized');
  if (topZ > 9000){
    Object.values(openWindows)
      .sort((a, b) => (+a.style.zIndex || 0) - (+b.style.zIndex || 0))
      .forEach((w, i) => w.style.zIndex = 100 + i);
    topZ = 100 + Object.keys(openWindows).length;
  }
  win.style.zIndex = ++topZ;
  updateDock();
}

function minimizeWindow(win){
  if (fullscreenWin === win) toggleFullscreen(win);
  win.classList.add('is-minimized');
  updateDock();
}

function closeWindow(win){
  const id = win.dataset.id;
  if (fullscreenWin === win){ fullscreenWin = null; fullscreenSaved = null; }
  delete openWindows[id];
  const iframe = win.querySelector('iframe');
  if (iframe){
    try { iframe.contentWindow.postMessage({ type:'naklios:beforeclose' }, '*'); } catch(_){}
    knownIframes.delete(iframe.contentWindow);
  }
  win.remove();
  updateDock();
}

function makeDraggable(win){
  const bar = win.querySelector('.nw-titlebar');
  bar.addEventListener('pointerdown', e => {
    // Don't start a drag from the title buttons or interactive children
    if (e.target.closest('.nw-close, .nw-fs-btn, button')) return;
    if (e.button !== 0) return;
    e.preventDefault(); // suppress text selection inside the titlebar
    const startX = e.clientX, startY = e.clientY;
    const origX = parseFloat(win.style.left) || 0;
    const origY = parseFloat(win.style.top) || 0;
    bar.classList.add('dragging');
    win.classList.add('is-dragging');
    focusWindow(win);

    const onMove = ev => {
      const x = origX + (ev.clientX - startX);
      const y = Math.max(50, origY + (ev.clientY - startY));
      win.style.left = x + 'px';
      win.style.top = y + 'px';
    };
    const onUp = () => {
      bar.classList.remove('dragging');
      win.classList.remove('is-dragging');
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      // Persist position so reopen / reload restores it
      if (win.dataset.id && !win.classList.contains('is-fullscreen')){
        state.layout.windowPositions[win.dataset.id] = {
          x: parseFloat(win.style.left) || 0,
          y: parseFloat(win.style.top) || 0,
        };
        saveLayout();
      }
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

function spawnInlineWindow(app){
  const builder = Classics[app.id];
  if (!builder) return window.open(app.url || '#', '_blank', 'noopener');
  const sizes = {
    minesweeper: {w:260, h:380},
    solitaire: {w:520, h:480},
    spider: {w:740, h:540},
    calculator: {w:260, h:360},
    notepad: {w:520, h:440},
  };
  const sz = sizes[app.id] || {w:480, h:380};
  const win = makeWindow({ id:app.id, title:app.name, width:sz.w, height:sz.h });
  const body = win.querySelector('.nw-body');
  builder(body, win);
}

function themedAppUrl(app){
  // Pass current theme so cooperating apps can inherit OS color scheme.
  // Apps that don't read these params see them as ignored extras.
  // For iframe embedding prefer app.embedUrl (same-origin mirror under naklios.dev/apps/<id>/);
  // fall back to app.url (canonical, cross-origin). Same-origin enables FSA picker etc.
  const base = app.embedUrl || app.url;
  const sep = base.includes('?') ? '&' : '?';
  return `${base}${sep}naklios-theme=${encodeURIComponent(state.theme)}`;
}

function spawnIframeWindow(app){
  const embedSrc = themedAppUrl(app);
  // Same-origin mirrors (naklios.dev/apps/<id>/) drop the sandbox so FSA/OPFS
  // picker etc. work. Cross-origin apps keep the sandbox — that's the privacy
  // wall the "🔒 sandboxed" badge promises.
  let isSameOrigin = false;
  try { isSameOrigin = new URL(embedSrc, location.href).origin === location.origin; } catch(_){}

  const win = makeWindow({
    id:app.id, title:app.name, width:980, height:640,
    badge:'EXPERIMENTAL', sandboxed: !isSameOrigin,
  });
  const body = win.querySelector('.nw-body');

  // Loading skeleton — removed on naklios:ready or after a 5s fallback.
  const skel = document.createElement('div');
  skel.className = 'nw-skeleton';
  const iconHTML = app.svg
    ? `<svg class="nw-skeleton-svg" viewBox="0 0 24 24" aria-hidden="true">${app.svg}</svg>`
    : `<div class="nw-skeleton-glyph">${app.glyph || app.name.charAt(0)}</div>`;
  skel.innerHTML = `${iconHTML}<div class="nw-skeleton-name">${app.name}</div><div class="nw-skeleton-bar"></div>`;
  body.appendChild(skel);
  win._skeletonTimeout = setTimeout(() => skel.remove(), 5000);

  const iframe = document.createElement('iframe');
  if (!isSameOrigin) {
    iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-popups allow-forms allow-downloads');
  }
  iframe.setAttribute('referrerpolicy', 'no-referrer');
  iframe.title = app.name;
  iframe.src = embedSrc;
  body.appendChild(iframe);
  // Register synchronously so messages posted by the iframe's first scripts
  // (typically naklios.title / naklios.ready) aren't dropped by the host's
  // knownIframes guard — the load event fires AFTER the iframe's sync scripts
  // have already postMessaged.
  try { knownIframes.add(iframe.contentWindow); } catch(_){}
  iframe.addEventListener('load', () => {
    try {
      // Belt-and-suspenders: re-add in case the contentWindow identity changed.
      knownIframes.add(iframe.contentWindow);
      // Send the theme so any listening app can apply it
      const t = THEMES.find(x => x.id === state.theme) || THEMES[0];
      iframe.contentWindow.postMessage({ type:'naklios:theme', theme:t.id, colors:t.colors, mood:t.mood }, '*');
      // Push capabilities (fs availability) so the SDK can flip naklios.capabilities.fs
      postCapabilities(iframe, app.id);
    } catch(_){}
  });
}

// ────────────────────────────────────────────────────────────────────
// Backend abstraction — FSA + Crate share the same naklios.fs.* surface.
// Each backend implements: read / readBinary / write / append / delete /
// exists (op against an `apps/<id>/<path>` string) + list (against an
// `apps/<id>` or `apps/<id>/<subdir>` prefix, returns strings).
// Permission state binds an app to one backend at a time; user can rebind
// via the per-app menu in Settings.
// ────────────────────────────────────────────────────────────────────

const BACKENDS = {
  fsa: {
    id: 'fsa',
    label: 'Folder',
    isConnected(){ return !!state.fsHandle; },
    displayName(){ return state.fsFolderName || ''; },
    async read(safePath){ return await fsRead(safePath); },
    async readBinary(safePath){ return await fsReadBinary(safePath); },
    async write(safePath, data){ await fsWrite(safePath, data); },
    async append(safePath, line){ await fsAppend(safePath, line); },
    async delete(safePath){ await fsDelete(safePath); },
    async exists(safePath){ return await fsExists(safePath); },
    async list(prefix){ return await fsList(prefix); },
  },
  crate: {
    id: 'crate',
    label: 'Crate',
    isConnected(){ return !!state.crate; },
    displayName(){ return state.crateBucketName || ''; },
    async read(safePath){
      const bytes = await state.crate.read('/' + safePath);
      return new TextDecoder().decode(bytes);
    },
    async readBinary(safePath){
      return await state.crate.read('/' + safePath);
    },
    async write(safePath, data){
      const bytes = (data instanceof Uint8Array) ? data
                   : (typeof data === 'string') ? new TextEncoder().encode(data)
                   : new Uint8Array(data);
      await state.crate.write('/' + safePath, bytes, { mime: guessMime(safePath) });
    },
    async append(safePath, line){
      // Crate has no native append; emulate via read + concat + write.
      // Same semantics as fsAppend in the FSA backend.
      let existing = '';
      try {
        const bytes = await state.crate.read('/' + safePath);
        existing = new TextDecoder().decode(bytes);
      } catch (_){}
      const trail = (line.endsWith('\n') ? line : line + '\n');
      const out = new TextEncoder().encode(existing + trail);
      await state.crate.write('/' + safePath, out, { mime: 'text/plain' });
    },
    async delete(safePath){ await state.crate.remove('/' + safePath); },
    async exists(safePath){ return (await state.crate.stat('/' + safePath)) != null; },
    async list(prefix){
      const entries = await state.crate.list('/' + (prefix || ''));
      // Crate returns objects; FSA returns strings. Normalise to FSA shape.
      return entries.map(e => {
        const p = (e.path || '').replace(/^\//, '');
        return e.isDir && !p.endsWith('/') ? p + '/' : p;
      }).sort();
    },
  },
};

function guessMime(path){
  const ext = (path.split('.').pop() || '').toLowerCase();
  const m = {
    json: 'application/json', jsonl: 'application/x-ndjson',
    txt: 'text/plain', md: 'text/markdown',
    html: 'text/html', css: 'text/css', js: 'application/javascript',
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg',
    gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp',
    pdf: 'application/pdf',
  }[ext];
  return m || 'application/octet-stream';
}

function backendsAvailable(){
  const out = [];
  if (BACKENDS.fsa.isConnected()) out.push('fsa');
  if (BACKENDS.crate.isConnected()) out.push('crate');
  return out;
}

// Migrate legacy 'granted'|'denied' strings to {backend, granted} shape.
// Lazy — runs on first read of an appId after the v2.19 upgrade.
function migrateAppPermission(appId){
  const v = state.appPermissions[appId];
  if (v == null || typeof v !== 'string') return;
  if (v === 'denied'){
    state.appPermissions[appId] = { granted: false };
  } else if (v === 'granted'){
    // The legacy value was always FSA-only. Preserve that binding so an
    // upgrade doesn't silently grant the app access to a Crate that's
    // connected for the first time.
    state.appPermissions[appId] = { backend: 'fsa', granted: true };
  }
  saveAppPermissions();
}

// fsEnsurePermission resolves the backend an app should use, prompting
// the user if no decision exists yet. Returns the backend id ('fsa'|'crate')
// on grant, or null on deny / no available backend / cancelled prompt.
async function fsEnsurePermission(appId){
  migrateAppPermission(appId);
  const v = state.appPermissions[appId];
  if (v && v.granted === false) return null;
  if (v && v.granted && v.backend){
    // Verify the backend the app was bound to is still connected.
    if (BACKENDS[v.backend]?.isConnected()) return v.backend;
    // Backend was disconnected — fall through to re-prompt.
  }
  const avail = backendsAvailable();
  if (avail.length === 0) return null;
  const app = APPS.find(a => a.id === appId);
  const name = app?.name || appId;

  let chosen = null;
  if (avail.length === 1){
    const only = BACKENDS[avail[0]];
    const where = only.id === 'fsa'
      ? `in your nakliOS folder (<code>${_dlgEscape(only.displayName())}</code>)`
      : `in your Crate (encrypted, multi-device — <code>${_dlgEscape(only.displayName())}</code>)`;
    const ok = await nakliosConfirm(
      `Let <strong>${_dlgEscape(name)}</strong> read and write its data ${where}?\n\n` +
      `It will be limited to <code>apps/${_dlgEscape(appId)}/</code> — no other apps' data.\n\n` +
      `You can revoke or switch backends later in Settings.`,
      {
        title: `Allow ${name}?`,
        okLabel: 'Allow',
        cancelLabel: 'Deny',
        allowHtmlBody: true,
      }
    );
    if (ok) chosen = only.id;
  } else {
    // Both backends connected — present them as a three-button choice.
    const ans = await _nakliosDialog({
      title: `Where should ${name} store its data?`,
      body:
        `Pick a backend for <strong>${_dlgEscape(name)}</strong>. ` +
        `It will be limited to <code>apps/${_dlgEscape(appId)}/</code>.\n\n` +
        `<strong>Folder</strong> — local: <code>${_dlgEscape(BACKENDS.fsa.displayName())}</code>\n` +
        `<strong>Crate</strong> — encrypted, multi-device: <code>${_dlgEscape(BACKENDS.crate.displayName())}</code>`,
      buttons: [
        { value: 'deny',   label: 'Deny' },
        { value: 'fsa',    label: 'Folder' },
        { value: 'crate',  label: 'Crate', primary: true },
      ],
      allowHtmlBody: true,
    });
    if (ans === 'fsa' || ans === 'crate') chosen = ans;
  }

  if (!chosen){
    state.appPermissions[appId] = { granted: false };
    saveAppPermissions();
    return null;
  }
  state.appPermissions[appId] = { backend: chosen, granted: true };
  saveAppPermissions();
  return chosen;
}

// Resolve { dir, name } for fs reply ops. Throws if path unsafe or no handle.
async function fsHostHandle(msg, type, appId){
  const backendId = await fsEnsurePermission(appId);
  if (!backendId) throw new Error('Permission denied');
  const backend = BACKENDS[backendId];
  if (!backend.isConnected()) throw new Error('Backend disconnected');
  const safe = fsSafePath(appId, msg.path || '');
  switch (type){
    case 'read':       return await backend.read(safe);
    case 'readBinary': return await backend.readBinary(safe);
    case 'write':      await backend.write(safe, msg.data); return null;
    case 'append':     await backend.append(safe, String(msg.line ?? '')); return null;
    case 'delete':     await backend.delete(safe); return null;
    case 'exists':     return await backend.exists(safe);
  }
  throw new Error('Unknown fs op: ' + type);
}
// list() is the only op that scopes to apps/<id>/ even when path is empty
async function fsHostList(msg, appId){
  const backendId = await fsEnsurePermission(appId);
  if (!backendId) throw new Error('Permission denied');
  const backend = BACKENDS[backendId];
  if (!backend.isConnected()) throw new Error('Backend disconnected');
  const subPath = (msg.prefix || '').split('/').filter(s => s && s !== '.' && s !== '..').join('/');
  const fullPrefix = subPath ? `apps/${appId}/${subPath}` : `apps/${appId}`;
  const all = await backend.list(fullPrefix);
  const stripPrefix = `apps/${appId}/`;
  return all.map(p => p.startsWith(stripPrefix) ? p.slice(stripPrefix.length) : p);
}

// Tell an iframe its current capabilities. Called on load and on changes.
function postCapabilities(iframe, appId){
  // fs is available if EITHER backend is connected AND the app isn't denied.
  // We don't pre-bind here — fsEnsurePermission runs on the first op call.
  const v = state.appPermissions[appId];
  const explicitlyDenied = v && typeof v === 'object' && v.granted === false;
  const fsCap = backendsAvailable().length > 0 && !explicitlyDenied;
  try { iframe.contentWindow.postMessage({ type:'naklios:capabilities', fs: fsCap }, '*'); } catch(_){}
}
function broadcastCapabilities(){
  document.querySelectorAll('.nw-window iframe').forEach(iframe => {
    const appId = iframe.closest('.nw-window')?.dataset.id;
    if (appId) postCapabilities(iframe, appId);
  });
  // Re-paint the topbar chips on every backend state change. Defensive
  // try — chips might not be in DOM yet during early boot.
  try { renderTopbarChips(); } catch(_){}
}

// ── TOPBAR BACKEND CHIPS ──────────────────────────────────────────────
// Two pill-buttons in the header showing the current state of each
// backend (Folder / Crate). Clicking opens a contextMenu-style popover
// with state-appropriate actions: Connect / Lock / Unlock / Disconnect.
// State changes propagate via broadcastCapabilities() → renderTopbarChips().

// Compute the visual state of each chip from current backend state.
// Returns one of: 'disconnected' | 'pending' | 'locked' | 'active'.
function fsaChipState(){
  if (state.fsHandle) return 'active';
  if (window._fsPendingHandle) return 'pending';
  return 'disconnected';
}
function crateChipState(){
  if (state.crate) return 'active';
  if (state.crateLocked) return 'locked';
  return 'disconnected';
}

function renderTopbarChips(){
  const fsaChip   = document.getElementById('fsa-chip');
  const crateChip = document.getElementById('crate-chip');
  if (!fsaChip || !crateChip) return;

  // FSA chip
  const fsaState = fsaChipState();
  fsaChip.className = 'topbar-chip' + (fsaState !== 'disconnected' ? ' ' + fsaState : '');
  const fsaLabel = fsaState === 'active' ? (state.fsFolderName || 'Folder')
                : fsaState === 'pending' ? (state.fsFolderName ? state.fsFolderName + ' (re-grant)' : 'Re-grant')
                : 'Folder';
  fsaChip.querySelector('.topbar-chip-label').textContent = fsaLabel;
  fsaChip.title = fsaState === 'active'   ? `Local folder: ${state.fsFolderName || ''}`
                : fsaState === 'pending'  ? 'Folder permission needs re-grant'
                                          : 'No local folder connected';

  // Crate chip
  const crState = crateChipState();
  crateChip.className = 'topbar-chip' + (crState !== 'disconnected' ? ' ' + crState : '');
  const crLabel = crState === 'active' ? (state.crateBucketName || 'Crate')
                : crState === 'locked' ? (state.crateBucketName ? state.crateBucketName + ' 🔒' : 'Locked')
                : 'Crate';
  crateChip.querySelector('.topbar-chip-label').textContent = crLabel;
  crateChip.title = crState === 'active' ? `Crate (unlocked): ${state.crateBucketName || ''}`
                  : crState === 'locked' ? `Crate locked: ${state.crateBucketName || ''}`
                                         : 'No Crate connected';
}

// FSA chip click → state-appropriate menu via the existing
// showContextMenu() helper. Positioned below the chip.
function openFsaChipMenu(){
  closeContextMenu(); // in case it's already open from a different anchor
  const chip = document.getElementById('fsa-chip');
  if (!chip) return;
  const r = chip.getBoundingClientRect();
  const items = [];
  const s = fsaChipState();
  if (s === 'active'){
    items.push({ label: '📁 Open Settings…', onClick: () => openSettings() });
    items.push({ separator: true });
    items.push({ label: 'Disconnect folder…', onClick: () => fsInteractiveDisconnect(), danger: true });
  } else if (s === 'pending'){
    items.push({ label: 'Re-grant access…', onClick: async () => { await fsRegrantPending(); } });
    items.push({ separator: true });
    items.push({ label: 'Disconnect folder…', onClick: () => fsInteractiveDisconnect(), danger: true });
  } else {
    items.push({ label: 'Connect folder…', onClick: () => fsConnect() });
  }
  // Position below the chip, left-aligned.
  showContextMenu(r.left, r.bottom + 6, items);
}

function openCrateChipMenu(){
  closeContextMenu();
  const chip = document.getElementById('crate-chip');
  if (!chip) return;
  const r = chip.getBoundingClientRect();
  const items = [];
  const s = crateChipState();
  if (s === 'active'){
    items.push({ label: '🔒 Lock now', onClick: () => crateLock() });
    items.push({ label: '☁️ Open Settings…', onClick: () => openSettings() });
    items.push({ separator: true });
    items.push({ label: 'Disconnect Crate…', onClick: () => crateInteractiveDisconnect(), danger: true });
  } else if (s === 'locked'){
    items.push({ label: '🔓 Unlock…', onClick: () => crateInteractiveUnlock() });
    items.push({ separator: true });
    items.push({ label: 'Disconnect Crate…', onClick: () => crateInteractiveDisconnect(), danger: true });
  } else {
    items.push({ label: 'Connect Crate…', onClick: () => crateInteractiveConnect() });
  }
  showContextMenu(r.left, r.bottom + 6, items);
}

// Wire the chip click handlers. Done once on first DOM-ready; chips
// themselves are persistent so we don't need to re-bind on re-render.
function bindTopbarChips(){
  document.getElementById('fsa-chip')?.addEventListener('click', openFsaChipMenu);
  document.getElementById('crate-chip')?.addEventListener('click', openCrateChipMenu);
}

window.addEventListener('message', async e => {
  if (!knownIframes.has(e.source)) return;
  const msg = e.data;
  if (!msg || typeof msg !== 'object') return;
  const findIframe = () => Array.from(document.querySelectorAll('.nw-window iframe'))
    .find(f => f.contentWindow === e.source);
  const findWin = () => { const f = findIframe(); return f ? f.closest('.nw-window') : null; };
  const getAppId = () => findWin()?.dataset.id || null;
  if (msg.type === 'naklios:ready'){
    const win = findWin();
    if (win){
      clearTimeout(win._skeletonTimeout);
      win.querySelector('.nw-skeleton')?.remove();
    }
  } else if (msg.type === 'naklios:close'){
    const win = findWin();
    if (win) closeWindow(win);
  } else if (msg.type === 'naklios:title' && typeof msg.title === 'string'){
    const win = findWin();
    if (win) win.querySelector('.nw-title').textContent = msg.title;
  } else if (msg.type === 'naklios:theme-request'){
    // App is asking for the current theme (e.g., late-loading app missed the load event)
    const t = THEMES.find(x => x.id === state.theme) || THEMES[0];
    try { e.source.postMessage({ type:'naklios:theme', theme:t.id, colors:t.colors, mood:t.mood }, '*'); } catch(_){}
  } else if (msg.type === 'naklios:capabilities-request'){
    const iframe = findIframe(); const appId = getAppId();
    if (iframe && appId) postCapabilities(iframe, appId);
  } else if (typeof msg.type === 'string' && msg.type.startsWith('naklios:fs:')){
    const reply = { type: 'naklios:fs:reply', requestId: msg.requestId };
    try {
      const appId = getAppId();
      if (!appId) throw new Error('Unknown app');
      const op = msg.type.slice('naklios:fs:'.length);
      if (op === 'list') reply.result = await fsHostList(msg, appId);
      else reply.result = await fsHostHandle(msg, op, appId);
    } catch (err){
      reply.error = String(err?.message || err);
    }
    try { e.source.postMessage(reply, '*'); } catch(_){}
  }
});

// ════════════════════════════════════════════════════════════════════
// MODE DISPATCH
// ════════════════════════════════════════════════════════════════════
function recordRecent(appId){
  state.layout.recent = (state.layout.recent || []).filter(x => x !== appId);
  state.layout.recent.unshift(appId);
  if (state.layout.recent.length > 12) state.layout.recent.length = 12;
  saveLayout();
}

function openApp(app){
  recordRecent(app.id);
  if (openWindows[app.id]) { focusWindow(openWindows[app.id]); return; }
  const m = effectiveMode(app);
  if (m === 'immersive') {
    if (app.kind === 'classic') return spawnInlineWindow(app);
    if (app.iframeable === false) return window.open(app.url, '_blank', 'noopener');
    return spawnIframeWindow(app);
  }
  // Basic
  if (app.kind === 'classic') return spawnInlineWindow(app);
  return window.open(app.url, '_blank', 'noopener');
}

// ════════════════════════════════════════════════════════════════════
// SPOTLIGHT
// ════════════════════════════════════════════════════════════════════
let spotlightOpen = false;

// ════════════════════════════════════════════════════════════════════
// FOLDERS — open as a centered popover with backdrop
// ════════════════════════════════════════════════════════════════════
let folderOpenId = null;

function openFolder(folder){
  closeFolder();
  folderOpenId = folder.id;
  const root = document.getElementById('overlay-root');
  const wrap = document.createElement('div');
  wrap.className = 'nw-backdrop';
  wrap.id = 'folder-backdrop';

  // Apps that have been moved out are excluded
  const movedOut = new Set(state.layout.unfoldered || []);
  const apps = folder.apps
    .map(aid => APPS.find(a => a.id === aid))
    .filter(Boolean)
    .filter(a => !movedOut.has(a.id));

  const appsHTML = apps.map(app => {
    const bgVar = app.bg || 'brand';
    const bgColor = `color-mix(in srgb, var(--${bgVar}) 22%, var(--panel))`;
    return `
      <button class="nw-folder-app" data-app-id="${app.id}" title="${(app.description||'').replace(/"/g,'&quot;')} — drag out to put on desktop">
        <div class="nw-folder-app-tile" style="background:${bgColor}; border-color:color-mix(in srgb, var(--${bgVar}) 30%, var(--line));">
          ${app.svg ? `<svg class="nw-icon-svg" viewBox="0 0 24 24" aria-hidden="true">${app.svg}</svg>` : (app.glyph || app.name.charAt(0))}
        </div>
        <div class="nw-folder-app-label">${app.name}</div>
      </button>`;
  }).join('');

  wrap.innerHTML = `
    <div class="nw-folder-popover" role="dialog" aria-label="${folder.name} folder">
      <div class="nw-folder-head">
        <div class="nw-folder-head-glyph">${folder.glyph}</div>
        <div class="nw-folder-head-title">${folder.name}
          <span class="nw-folder-head-count">  ·  ${apps.length} apps  ·  right-click or drag out to move to desktop</span>
        </div>
        <button class="nw-folder-close" aria-label="Close folder">✕</button>
      </div>
      <div class="nw-folder-grid">${appsHTML}</div>
    </div>
  `;
  root.appendChild(wrap);

  wrap.querySelectorAll('.nw-folder-app').forEach(btn => {
    const app = APPS.find(a => a.id === btn.dataset.appId);
    if (!app) return;

    // Drag-out gesture: down → if pointer leaves popover → close popover + ghost drag → drop sets desktop position
    let wasDragged = false;
    btn.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      e.preventDefault();
      const startX = e.clientX, startY = e.clientY;
      let dragging = false;
      let ghost = null;
      let popClosed = false;

      function overDock(ev){
        const dock = document.getElementById('nw-dock');
        if (!dock) return false;
        const r = dock.getBoundingClientRect();
        // Generous hit-area: 12px halo around the dock so it's easy to drop on
        return ev.clientX >= r.left - 12 && ev.clientX <= r.right + 12
            && ev.clientY >= r.top - 12 && ev.clientY <= r.bottom + 12;
      }
      const onMove = ev => {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (!dragging && Math.hypot(dx, dy) > 6){
          dragging = true;
          ghost = document.createElement('div');
          ghost.className = 'nw-drag-ghost';
          if (app.svg) ghost.innerHTML = `<svg class="nw-icon-svg" viewBox="0 0 24 24" aria-hidden="true">${app.svg}</svg>`;
          else ghost.textContent = app.glyph || app.name.charAt(0);
          document.body.appendChild(ghost);
        }
        if (dragging){
          ghost.style.left = ev.clientX + 'px';
          ghost.style.top = ev.clientY + 'px';
          if (!popClosed){
            const pop = document.querySelector('.nw-folder-popover');
            if (pop){
              const r = pop.getBoundingClientRect();
              const outside = ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom;
              if (outside){
                popClosed = true;
                closeFolder();
              }
            }
          }
          // Visual hint: highlight the dock when the cursor is over it
          const dock = document.getElementById('nw-dock');
          if (dock) dock.classList.toggle('is-drop-target', overDock(ev));
        }
      };
      const onUp = ev => {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        document.getElementById('nw-dock')?.classList.remove('is-drop-target');
        if (!dragging) return;
        wasDragged = true;
        ghost?.remove();
        if (overDock(ev)){
          // Drop on dock → pin this app
          pinItem(app.id);
        } else {
          // Drop in icon-area? Calculate grid position
          const area = document.getElementById('icon-area').getBoundingClientRect();
          const inArea = ev.clientX >= area.left && ev.clientX <= area.right
                      && ev.clientY >= area.top && ev.clientY <= area.bottom;
          if (inArea){
            const { cols, rows } = getGridDims();
            const x = Math.max(0, Math.min(cols - 1, Math.round((ev.clientX - area.left - GRID_PAD) / ICON_W)));
            const y = Math.max(0, Math.min(rows - 1, Math.round((ev.clientY - area.top - GRID_PAD) / ICON_H)));
            state.layout.unfoldered = state.layout.unfoldered || [];
            if (!state.layout.unfoldered.includes(app.id)) state.layout.unfoldered.push(app.id);
            state.layout.positions[app.id] = {x, y};
            saveLayout();
            renderIcons();
          } else if (!popClosed){
            // Cancelled drag inside popover — no-op
          }
        }
        // Suppress the click event that follows
        setTimeout(() => { wasDragged = false; }, 50);
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });

    btn.addEventListener('click', () => {
      if (wasDragged) return;
      closeFolder();
      openApp(app);
    });

    btn.addEventListener('contextmenu', e => {
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, [
        { label: 'Move to desktop', onClick: () => { closeFolder(); moveAppToDesktop(app.id); } },
        { separator:true },
        { label: isPinned(app.id) ? 'Unpin from dock' : 'Pin to dock',
          onClick: () => isPinned(app.id) ? unpinItem(app.id) : pinItem(app.id) },
      ]);
    });
  });
  wrap.querySelector('.nw-folder-close').addEventListener('click', closeFolder);
  wrap.addEventListener('click', e => { if (e.target === wrap) closeFolder(); });
}

function closeFolder(){
  const w = document.getElementById('folder-backdrop');
  if (w) w.remove();
  folderOpenId = null;
}

function openSpotlight(){
  if (spotlightOpen) return;
  spotlightOpen = true;
  const root = document.getElementById('overlay-root');
  const wrap = document.createElement('div');
  wrap.className = 'nw-backdrop';
  wrap.innerHTML = `
    <div class="nw-spotlight" role="dialog" aria-label="Search apps">
      <input type="text" id="spot-input" placeholder="Search apps by name, tag, or description…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="nw-spot-list" id="spot-list"></div>
    </div>
  `;
  root.appendChild(wrap);
  const input = wrap.querySelector('#spot-input');
  const list = wrap.querySelector('#spot-list');
  let active = 0;

  function rank(q){
    if (!q) {
      const recentIds = state.layout.recent || [];
      const recents = recentIds.map(id => APPS.find(a => a.id === id)).filter(Boolean);
      if (recents.length) return recents.slice(0, 8);
      return APPS.slice(0, 8);
    }
    const ql = q.toLowerCase();
    const scored = [];
    for (const app of APPS){
      const name = app.name.toLowerCase();
      const desc = (app.description || '').toLowerCase();
      const tags = (app.tags || []).join(' ').toLowerCase();
      let s = 0;
      if (name.startsWith(ql)) s = 100;
      else if (name.includes(ql)) s = 60;
      else if (tags.includes(ql)) s = 40;
      else if (desc.includes(ql)) s = 20;
      if (s > 0) scored.push({app, s});
    }
    scored.sort((a, b) => b.s - a.s);
    return scored.slice(0, 12).map(x => x.app);
  }

  function render(){
    const items = rank(input.value.trim());
    if (active >= items.length) active = 0;
    list.innerHTML = items.map((app, i) => `
      <div class="nw-spot-item ${i === active ? 'is-active' : ''}" data-idx="${i}">
        <div class="nw-spot-glyph" style="background:color-mix(in srgb, var(--${app.bg || 'brand'}) 22%, var(--row));">${app.svg ? `<svg class="nw-icon-svg" viewBox="0 0 24 24" aria-hidden="true">${app.svg}</svg>` : (app.glyph || app.name.charAt(0))}</div>
        <div style="flex:1; min-width:0;">
          <div class="nw-spot-name">${app.name}</div>
          <div class="nw-spot-desc">${(app.description || '').replace(/&mdash;/g,'—').replace(/&rarr;/g,'→').replace(/&times;/g,'×')}</div>
        </div>
        <div class="nw-spot-meta">${app.kind === 'classic' ? 'built-in' : (app.tags || [])[0] || ''}</div>
      </div>
    `).join('') || `<div class="nw-spot-item"><span class="nw-spot-desc">No matches.</span></div>`;
    list.querySelectorAll('.nw-spot-item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = +el.dataset.idx;
        const items2 = rank(input.value.trim());
        if (items2[idx]) { close(); openApp(items2[idx]); }
      });
    });
  }

  function close(){
    spotlightOpen = false;
    wrap.remove();
  }

  input.addEventListener('input', () => { active = 0; render(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { close(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); active++; render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active-1); render(); }
    else if (e.key === 'Enter') {
      const items = rank(input.value.trim());
      if (items[active]) { close(); openApp(items[active]); }
    }
  });
  wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
  render();
  setTimeout(() => input.focus(), 0);
}

  wrap.querySelector('#crate-connect')?.addEventListener('click', async () => {

  });

  wrap.querySelector('#crate-unlock')?.addEventListener('click', async () => {

  });

  wrap.querySelector('#crate-disconnect')?.addEventListener('click', async () => {

  });

  });

// Tiny helper to pick a single file via a hidden <input type=file>.
function pickFile(accept){
  return new Promise(resolve => {
    const inp = document.createElement('input');
    inp.type = 'file';
    if (accept) inp.accept = accept;
    inp.addEventListener('change', () => resolve(inp.files?.[0] || null));
    // Some browsers need the input in the DOM
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.click();
    // Resolve(null) on cancel — browsers don't reliably fire a cancel event,
    // so we don't add a fallback timeout here (would race a slow picker).
    // The function resolves once the user picks OR garbage-collects naturally.
  });
}

function outsideHandler(e){
  const pop = document.getElementById('settings-pop');
  const btn = document.getElementById('settings-btn');
  if (!pop) return;
  if (pop.contains(e.target) || btn.contains(e.target)) return;
  closeSettings();
}

function closeSettings(){
  const pop = document.getElementById('settings-pop');
  if (pop) pop.remove();
  settingsOpen = false;
  document.removeEventListener('pointerdown', outsideHandler);
}

// STICKY NOTES
// ════════════════════════════════════════════════════════════════════
const STICKY_COLORS = ['yellow', 'pink', 'blue', 'green', 'purple'];

function addSticky(x, y){
  const s = {
    id: 's_' + Math.random().toString(36).slice(2, 10),
    x: Math.max(0, x - 60),
    y: Math.max(0, y - 14),
    w: 200, h: 160,
    text: '',
    color: STICKY_COLORS[state.layout.stickies.length % STICKY_COLORS.length],
  };
  state.layout.stickies.push(s);
  saveLayout();
  renderStickies();
  const el = document.querySelector(`.nw-sticky[data-id="${s.id}"]`);
  el?.querySelector('.nw-sticky-body').focus();
}

function updateSticky(id, patch){
  const s = state.layout.stickies.find(x => x.id === id);
  if (!s) return;
  Object.assign(s, patch);
  saveLayout();
}

function deleteSticky(id){
  state.layout.stickies = state.layout.stickies.filter(s => s.id !== id);
  saveLayout();
  renderStickies();
}

function renderStickies(){
  const area = document.getElementById('icon-area');
  if (!area) return;
  area.querySelectorAll('.nw-sticky').forEach(el => el.remove());
  for (const s of state.layout.stickies){
    const el = document.createElement('div');
    el.className = 'nw-sticky';
    el.dataset.id = s.id;
    el.dataset.color = s.color;
    el.style.left = s.x + 'px';
    el.style.top = s.y + 'px';
    el.style.width = s.w + 'px';
    el.style.height = s.h + 'px';
    el.innerHTML = `
      <div class="nw-sticky-bar">
        <span class="nw-sticky-swatch" title="Cycle color"></span>
        <span class="nw-sticky-spacer"></span>
        <button class="nw-sticky-close" aria-label="Delete sticky" title="Delete">✕</button>
      </div>
      <div class="nw-sticky-body" contenteditable="true" spellcheck="false"></div>
      <div class="nw-sticky-resize" aria-hidden="true"></div>
    `;
    el.querySelector('.nw-sticky-body').textContent = s.text;
    area.appendChild(el);
    wireSticky(el, s);
  }
}

function wireSticky(el, s){
  const body = el.querySelector('.nw-sticky-body');
  body.addEventListener('input', () => updateSticky(s.id, { text: body.textContent }));

  el.querySelector('.nw-sticky-close').addEventListener('click', e => {
    e.stopPropagation();
    deleteSticky(s.id);
  });

  el.querySelector('.nw-sticky-swatch').addEventListener('click', e => {
    e.stopPropagation();
    const idx = STICKY_COLORS.indexOf(s.color);
    const next = STICKY_COLORS[(idx + 1) % STICKY_COLORS.length];
    s.color = next;
    el.dataset.color = next;
    saveLayout();
  });

  const bar = el.querySelector('.nw-sticky-bar');
  bar.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    if (e.target.closest('.nw-sticky-close, .nw-sticky-swatch')) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const origX = s.x, origY = s.y;
    let dragging = false;
    const onMove = ev => {
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      if (!dragging && Math.hypot(dx, dy) > 3){
        dragging = true;
        el.classList.add('dragging');
      }
      if (dragging){
        s.x = Math.max(0, origX + dx);
        s.y = Math.max(0, origY + dy);
        el.style.left = s.x + 'px';
        el.style.top = s.y + 'px';
      }
    };
    const onUp = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      if (dragging){
        el.classList.remove('dragging');
        saveLayout();
      }
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });

  el.querySelector('.nw-sticky-resize').addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    const startX = e.clientX, startY = e.clientY;
    const origW = s.w, origH = s.h;
    const onMove = ev => {
      s.w = Math.max(140, origW + ev.clientX - startX);
      s.h = Math.max(100, origH + ev.clientY - startY);
      el.style.width = s.w + 'px';
      el.style.height = s.h + 'px';
    };
    const onUp = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      saveLayout();
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });

  el.addEventListener('contextmenu', e => {
    if (e.target.closest('.nw-sticky-body')) return; // native menu for paste/copy
    e.preventDefault();
    e.stopPropagation();
    showContextMenu(e.clientX, e.clientY, [
      { label: 'Cycle color', onClick: () => el.querySelector('.nw-sticky-swatch').click() },
      { separator: true },
      { label: 'Delete sticky', danger: true, onClick: () => deleteSticky(s.id) },
    ]);
  });
}

const Classics = {};

// ── Minesweeper ──
Classics.minesweeper = (body, win) => {
  body.innerHTML = `
    <div class="cl-mine">
      <div class="cl-mine-head">
        <span class="cl-mine-meter" id="mine-flags">💣 10</span>
        <span style="flex:1"></span>
        <span class="cl-mine-meter" id="mine-time">000</span>
        <button class="cl-mine-btn" id="mine-reset">🔄</button>
      </div>
      <div class="cl-mine-grid" id="mine-grid"></div>
      <div class="cl-mine-msg" id="mine-msg">Click to reveal · Right-click to flag</div>
    </div>
  `;
  const cols = 9, rows = 9, mines = 10;
  const grid = body.querySelector('#mine-grid');
  const msg = body.querySelector('#mine-msg');
  const flagEl = body.querySelector('#mine-flags');
  const timeEl = body.querySelector('#mine-time');
  let board = [], opened = [], flagged = [], started = false, finished = false, t0 = 0, tHandle = null;

  function tick(){
    const s = Math.min(999, Math.floor((Date.now() - t0) / 1000));
    timeEl.textContent = String(s).padStart(3, '0');
  }

  function reset(){
    if (tHandle) { clearInterval(tHandle); tHandle = null; }
    started = false; finished = false;
    timeEl.textContent = '000';
    board = Array.from({length:rows}, () => Array(cols).fill(0));
    opened = Array.from({length:rows}, () => Array(cols).fill(false));
    flagged = Array.from({length:rows}, () => Array(cols).fill(false));
    grid.style.gridTemplateColumns = `repeat(${cols}, 24px)`;
    grid.innerHTML = '';
    msg.textContent = 'Click to reveal · Right-click to flag';
    flagEl.textContent = `💣 ${mines}`;
    for (let y = 0; y < rows; y++){
      for (let x = 0; x < cols; x++){
        const cell = document.createElement('div');
        cell.className = 'cl-mine-cell';
        cell.dataset.x = x; cell.dataset.y = y;
        cell.addEventListener('click', () => reveal(x, y));
        cell.addEventListener('contextmenu', e => { e.preventDefault(); toggleFlag(x, y); });
        grid.appendChild(cell);
      }
    }
  }

  function plant(avoidX, avoidY){
    let n = 0;
    while (n < mines){
      const x = Math.floor(Math.random()*cols), y = Math.floor(Math.random()*rows);
      if (board[y][x] === -1) continue;
      if (Math.abs(x - avoidX) <= 1 && Math.abs(y - avoidY) <= 1) continue;
      board[y][x] = -1; n++;
    }
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
      if (board[y][x] === -1) continue;
      let c = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
        const nx = x+dx, ny = y+dy;
        if (nx>=0 && nx<cols && ny>=0 && ny<rows && board[ny][nx] === -1) c++;
      }
      board[y][x] = c;
    }
  }

  function cellEl(x, y){ return grid.children[y * cols + x]; }

  function reveal(x, y){
    if (finished || flagged[y][x] || opened[y][x]) return;
    if (!started){ started = true; plant(x, y); t0 = Date.now(); tHandle = setInterval(tick, 1000); }
    if (board[y][x] === -1){
      const el = cellEl(x, y);
      el.classList.add('open','boom'); el.textContent = '💥';
      finished = true;
      if (tHandle) { clearInterval(tHandle); tHandle = null; }
      // reveal all mines
      for (let yy = 0; yy < rows; yy++) for (let xx = 0; xx < cols; xx++){
        if (board[yy][xx] === -1){ cellEl(xx, yy).classList.add('open'); if (!flagged[yy][xx]) cellEl(xx, yy).textContent = '💣'; }
      }
      msg.textContent = 'Boom. Hit reset to try again.';
      return;
    }
    floodOpen(x, y);
    checkWin();
  }

  function floodOpen(x, y){
    const stack = [[x,y]];
    while (stack.length){
      const [cx, cy] = stack.pop();
      if (cx<0 || cy<0 || cx>=cols || cy>=rows) continue;
      if (opened[cy][cx] || flagged[cy][cx]) continue;
      if (board[cy][cx] === -1) continue;
      opened[cy][cx] = true;
      const el = cellEl(cx, cy);
      el.classList.add('open');
      if (board[cy][cx] > 0){
        el.textContent = board[cy][cx];
        el.dataset.n = board[cy][cx];
      } else {
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
          if (dx || dy) stack.push([cx+dx, cy+dy]);
        }
      }
    }
  }

  function toggleFlag(x, y){
    if (finished || opened[y][x]) return;
    if (!started){ started = true; plant(x, y); t0 = Date.now(); tHandle = setInterval(tick, 1000); }
    flagged[y][x] = !flagged[y][x];
    const el = cellEl(x, y);
    el.classList.toggle('flag', flagged[y][x]);
    el.textContent = flagged[y][x] ? '⚑' : '';
    let used = 0; for (const row of flagged) for (const f of row) if (f) used++;
    flagEl.textContent = `💣 ${mines - used}`;
  }

  function checkWin(){
    let openedCount = 0;
    for (const row of opened) for (const o of row) if (o) openedCount++;
    if (openedCount === rows*cols - mines){
      finished = true;
      if (tHandle) { clearInterval(tHandle); tHandle = null; }
      msg.textContent = `Cleared in ${timeEl.textContent}s. Nice.`;
    }
  }

  body.querySelector('#mine-reset').addEventListener('click', reset);
  reset();
};

// ── Notepad (plain text + Markdown preview) ──
function mdToHtml(src){
  // Minimal, zero-dependency Markdown renderer. Handles common cases.
  // Escape HTML first
  let s = src.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Fenced code blocks (must run before other replacements)
  s = s.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (m, lang, code) =>
    `␀CB${btoa(unescape(encodeURIComponent(code)))}CB␀`);
  // Inline code (single backticks)
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // Headings
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  s = s.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Horizontal rule
  s = s.replace(/^(?:---|\*\*\*|___)\s*$/gm, '<hr>');
  // Blockquotes (single-line)
  s = s.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  // Bold then italic (** before *)
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  s = s.replace(/_([^_\n]+)_/g, '<em>$1</em>');
  // Links
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, txt, url) => {
    const safeUrl = /^(https?:|mailto:|#|\/)/i.test(url) ? url : '#';
    return `<a href="${safeUrl}" target="_blank" rel="noopener">${txt}</a>`;
  });
  // Lists — consecutive `- ` or `* ` lines → <ul>
  s = s.replace(/(?:^[-*] .+(?:\n|$))+/gm, m => {
    const items = m.trim().split(/\n/).map(l => `<li>${l.replace(/^[-*] /, '')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  // Ordered lists
  s = s.replace(/(?:^\d+\. .+(?:\n|$))+/gm, m => {
    const items = m.trim().split(/\n/).map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });
  // Paragraphs: split on double newline
  s = s.split(/\n\n+/).map(p => {
    p = p.trim();
    if (!p) return '';
    if (/^<(h[1-6]|ul|ol|pre|blockquote|hr|␀CB)/.test(p)) return p;
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).join('\n');
  // Restore fenced code blocks
  s = s.replace(/␀CB([A-Za-z0-9+/=]+)CB␀/g, (m, b64) => {
    const code = decodeURIComponent(escape(atob(b64)))
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<pre><code>${code}</code></pre>`;
  });
  return s;
}

Classics.notepad = (body, win) => {
  const KEY = 'nakliOS.notepad.v1';
  const MODE_KEY = 'nakliOS.notepad.mode';
  const saved = localStorage.getItem(KEY) || '';
  const mode = localStorage.getItem(MODE_KEY) || 'edit'; // 'edit' | 'preview'
  body.innerHTML = `
    <div class="cl-pad">
      <div class="cl-pad-bar">
        <span class="cl-pad-mode">
          <button class="cl-pad-btn ${mode === 'edit' ? 'active' : ''}" data-mode="edit">Edit</button>
          <button class="cl-pad-btn ${mode === 'preview' ? 'active' : ''}" data-mode="preview">Preview</button>
        </span>
        <span class="grow"></span>
        <button class="cl-pad-btn" id="pad-copy">Copy</button>
        <button class="cl-pad-btn" id="pad-clear">Clear</button>
      </div>
      <textarea class="cl-pad-area" id="pad-area" spellcheck="false" placeholder="Plain text or Markdown — # headings, **bold**, - lists, [links](https://...), \`code\`. Autosaves.">${saved.replace(/</g,'&lt;')}</textarea>
      <div class="cl-pad-preview" id="pad-preview" style="display:none"></div>
      <div class="cl-pad-status">
        <span id="pad-count">${saved.length} chars · ${saved.split(/\s+/).filter(Boolean).length} words</span>
        <span class="grow" style="flex:1"></span>
        <span id="pad-status">Saved</span>
      </div>
    </div>
  `;
  const ta = body.querySelector('#pad-area');
  const pv = body.querySelector('#pad-preview');
  const count = body.querySelector('#pad-count');
  const status = body.querySelector('#pad-status');
  let curMode = mode;
  let saveT;

  function updateCount(){
    const t = ta.value;
    count.textContent = `${t.length} chars · ${t.split(/\s+/).filter(Boolean).length} words`;
  }
  function applyMode(m){
    curMode = m;
    localStorage.setItem(MODE_KEY, m);
    body.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
    if (m === 'preview'){
      pv.innerHTML = mdToHtml(ta.value);
      pv.style.display = 'block';
      ta.style.display = 'none';
    } else {
      ta.style.display = '';
      pv.style.display = 'none';
      setTimeout(() => ta.focus(), 0);
    }
  }

  ta.addEventListener('input', () => {
    status.textContent = 'Saving…';
    updateCount();
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      localStorage.setItem(KEY, ta.value);
      status.textContent = 'Saved';
    }, 250);
  });
  body.querySelector('#pad-copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(ta.value); status.textContent = 'Copied'; }
    catch(_) { status.textContent = 'Copy failed'; }
    setTimeout(() => { status.textContent = 'Saved'; }, 1200);
  });
  body.querySelector('#pad-clear').addEventListener('click', async () => {
    if (!ta.value) return;
    const ok = await nakliosConfirm('This empties the notepad. Cannot be undone.', {
      title: 'Clear the notepad?', okLabel: 'Clear', danger: true,
    });
    if (!ok) return;
    ta.value = '';
    localStorage.setItem(KEY, '');
    updateCount();
    if (curMode === 'preview') pv.innerHTML = '';
    status.textContent = 'Cleared';
  });
  body.querySelectorAll('[data-mode]').forEach(b => {
    b.addEventListener('click', () => applyMode(b.dataset.mode));
  });

  applyMode(curMode);
};
