name: Sync app mirrors

# Pulls the latest index.html for each app in apps/manifest.json and opens a PR
# if anything changed. Triggered by:
#   - source repos pushing to their main branch (via `gh workflow run` in their
#     own CI — see e.g. NakliTechie/Tijori .github/workflows/notify-naklios.yml)
#   - manual: Actions tab → "Sync app mirrors" → "Run workflow"
#   - six-hour fallback polling when a source repository has no dispatch token

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sync mirrors
        run: bash scripts/sync-mirrors.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify mirror lock and artifact hashes
        run: node scripts/validate-mirrors.mjs

      - name: Create pull request if anything changed
        uses: peter-evans/create-pull-request@v8
        with:
          title: 'chore: sync app mirrors'
          branch: sync/mirrors
          commit-message: 'chore: sync app mirrors from upstream repos'
          body: |
            Automated mirror of upstream release artifacts into `apps/`.

            Review the diff, then merge. Cloudflare Pages redeploys `naklios.dev`
            on push to `main` so the mirrored versions go live within minutes.

            Standalone repositories remain the source of truth. This PR records
            each resolved upstream commit and artifact SHA-256 in
            `apps/manifest.lock.json` for deterministic review and rollback.
          delete-branch: true
