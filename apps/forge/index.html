<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forge</title>
<link rel="stylesheet" href="../../vendor/xterm/5.5.0/xterm.css">
<style>
  /* Forge token palette (FORGE-UX-UI-REFERENCE §6) — dark first, one amber accent. */
  :root{
    --bg-0:#0E1012; --bg-1:#15181B; --bg-2:#1C2024; --bg-3:#242A2F;
    --fg-0:#E6E9EB; --fg-1:#A8B0B6; --fg-2:#6E777D; --rule:#262C31;
    --accent:#D98A28; --accent-dim:#8A5A1C;
    --ok:#5C9E6B; --warn:#C9A227; --err:#C2564B;
    --font-ui:"IBM Plex Sans",system-ui,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --radius:3px; --rule-w:1px; --dur:120ms; --ease:cubic-bezier(.2,0,0,1);
  }
  *{box-sizing:border-box}
  /* Scrollbars — themed to the amber palette, not the browser default white/grey.
     Applies to any overflow, incl. the xterm scrollback viewport. */
  *{ scrollbar-width:thin; scrollbar-color:var(--accent-dim) transparent; }
  *::-webkit-scrollbar{ width:10px; height:10px; }
  *::-webkit-scrollbar-track,
  *::-webkit-scrollbar-corner{ background:transparent; }
  *::-webkit-scrollbar-thumb{
    background:var(--accent-dim); border:2px solid transparent;
    border-radius:999px; background-clip:padding-box;
  }
  *::-webkit-scrollbar-thumb:hover{ background:var(--accent); }
  html,body{height:100%;margin:0}
  body{
    background:var(--bg-0); color:var(--fg-0); font-family:var(--font-ui);
    font-size:12px; display:flex; flex-direction:column; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* Header — wordmark + cwd status. Grouping is space + a hairline rule, no card. */
  header{
    display:flex; align-items:center; gap:10px; padding:8px 12px;
    border-bottom:var(--rule-w) solid var(--rule); background:var(--bg-1);
    flex:0 0 auto;
  }
  .brand{font-weight:600; letter-spacing:.02em}
  .brand b{color:var(--accent)}
  .status{color:var(--fg-2); font-family:var(--font-mono); font-size:11px}
  .spacer{flex:1}
  .hint{color:var(--fg-2); font-size:11px}
  .hint kbd{
    font-family:var(--font-mono); color:var(--fg-1);
    border:var(--rule-w) solid var(--rule); border-radius:var(--radius);
    padding:1px 5px; background:var(--bg-2);
  }
  /* Terminal surface fills the rest. */
  #term{flex:1; min-height:0; padding:8px 10px; background:var(--bg-0)}
  .xterm .xterm-viewport{background:transparent!important}
  /* Mobile key bar (§4) — the keys a soft keyboard hides. */
  .keybar{
    display:none; gap:6px; padding:6px 8px; border-top:var(--rule-w) solid var(--rule);
    background:var(--bg-1); flex:0 0 auto;
  }
  .keybar button{
    font-family:var(--font-mono); font-size:12px; color:var(--fg-1);
    background:var(--bg-2); border:var(--rule-w) solid var(--rule);
    border-radius:var(--radius); padding:6px 10px; min-width:40px;
  }
  .keybar button:active{border-color:var(--accent); color:var(--accent)}
  @media (max-width:700px){ .keybar{display:flex} .hint{display:none} }
</style>
</head>
<body>
  <header>
    <span class="brand"><b>◆</b> Forge</span>
    <span class="status" id="cwd">/</span>
    <span class="spacer"></span>
    <span class="hint">a terminal over your files · <kbd>help</kbd></span>
  </header>
  <div id="term"></div>
  <nav class="keybar" id="keybar" aria-label="Terminal keys">
    <button data-seq="\t">Tab</button>
    <button data-seq="\x03">^C</button>
    <button data-seq="\x1b[A">↑</button>
    <button data-seq="\x1b[B">↓</button>
    <button data-seq="/">/</button>
    <button data-seq="-">-</button>
    <button data-seq="|">|</button>
  </nav>

  <script src="../../sdk/naklios.js"></script>
  <script type="module">
    import { Terminal } from '../../vendor/xterm/5.5.0/xterm.mjs';
    import { FitAddon } from '../../vendor/xterm/5.5.0/addon-fit.mjs';
    import { createFileops, MemoryBackend } from '../../sys/rig/fileops/index.mjs';
    import { FsaBackend } from '../../sys/rig/fileops/fsa-backend.mjs';
    import { createGitCore } from '../../sys/rig/git/git-core.mjs';
    import { buildRigRegistry } from '../../sys/rig/registry/index.mjs';
    import { createGrant, createOpLog, createAgentFace } from '../../sys/rig/agent/index.mjs';
    import { createShell } from '../../sys/rig/cli/shell.mjs';
    import { createLineEditor } from '../../sys/rig/cli/lineeditor.mjs';
    import { createCompleter } from '../../sys/rig/cli/completer.mjs';
    import { runAgentLoop } from '../../sys/ai/agent-loop.mjs';
    import { codingToolset, makeToolExecutor } from '../../sys/ai/agent-tools.mjs';
    import { createKiln, createWorkerRuntime } from '../../sys/kiln/index.mjs';
    import { createFsBridge } from '../../sys/kiln/fs-bridge.mjs';
    import { generateRigModule } from '../../sys/kiln/rig-bindings.mjs';

    const nak = window.naklios || null;
    const ACCENT = '\x1b[38;2;217;138;40m';
    const DIM = '\x1b[38;2;110;119;125m';
    const RESET = '\x1b[0m';

    // ── Workspace backend: a real local folder (File System Access) if the user
    // picked one, remembered across reloads in IndexedDB; else an in-memory
    // scratch. Every folder path is wrapped so a failure falls back to memory —
    // the terminal must always come up. ──
    const DIR_DB = 'forge-fs', DIR_STORE = 'h', DIR_KEY = 'workspace-dir';
    function idbOpen() {
      return new Promise((res, rej) => {
        const r = indexedDB.open(DIR_DB, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(DIR_STORE);
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    }
    async function idbGet(k) { try { const db = await idbOpen(); return await new Promise((res) => { const t = db.transaction(DIR_STORE).objectStore(DIR_STORE).get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(null); }); } catch (_) { return null; } }
    async function idbSet(k, v) { try { const db = await idbOpen(); await new Promise((res) => { const t = db.transaction(DIR_STORE, 'readwrite').objectStore(DIR_STORE).put(v, k); t.oncomplete = res; t.onerror = res; }); } catch (_) {} }
    async function idbDel(k) { try { const db = await idbOpen(); await new Promise((res) => { const t = db.transaction(DIR_STORE, 'readwrite').objectStore(DIR_STORE).delete(k); t.oncomplete = res; t.onerror = res; }); } catch (_) {} }

    let backend = null;
    let workspaceLabel = 'memory · scratch';
    try {
      const savedDir = await idbGet(DIR_KEY);
      if (savedDir && typeof savedDir.queryPermission === 'function') {
        let perm = await savedDir.queryPermission({ mode: 'readwrite' });
        if (perm !== 'granted') { try { perm = await savedDir.requestPermission({ mode: 'readwrite' }); } catch (_) {} }
        if (perm === 'granted') { backend = new FsaBackend(savedDir); workspaceLabel = 'folder · ' + savedDir.name; }
      }
    } catch (_) { backend = null; }
    if (!backend) backend = new MemoryBackend();
    const usingFolder = workspaceLabel.startsWith('folder');

    const fs = createFileops({ backend });
    // Seed a starter workspace ONLY for the in-memory scratch — never scribble
    // into a user's real folder.
    if (!usingFolder) {
      await fs.write('README.md', '# Forge workspace\n\nA bash-style terminal over your files, in the browser.\nTry: ls, cat README.md, echo hi > note.txt, git init, help\nPersist to a real folder: use-folder\n');
      await fs.write('src/main.py', 'print("hello from Forge")\n');
    }
    const git = createGitCore({ fs, dir: '/' });
    const registry = buildRigRegistry({ fs, git });
    const grant = createGrant({ prefixes: [''], scopes: ['fs:read', 'fs:write', 'fs:remove', 'git:read', 'git:write'] });
    // Op-log on a separate backend so it never appears in the workspace tree.
    const opLog = createOpLog({ fs: createFileops({ backend: new MemoryBackend() }) });
    const face = createAgentFace({ registry, grant, opLog, actor: 'agent' });

    // ── Kiln: real Python via Pyodide, but ONLY when the tab is cross-origin
    // isolated (SharedArrayBuffer). Everything is wrapped so a Kiln failure never
    // takes the terminal down — python just reports unavailable. ──
    const pyReady = self.crossOriginIsolated === true;
    let kiln = null;
    let pyAnnounced = false;
    if (pyReady) {
      try {
        const rigModuleSource = generateRigModule(registry).source;
        const fsBridge = createFsBridge({ backend, mount: '' });
        kiln = createKiln({
          sizeBytes: 12 * 1024 * 1024,
          consent: () => true, // typing `python` is consent; a one-time notice prints on first load
          loadRuntime: () => createWorkerRuntime({ face, fsBridge, rigModuleSource }),
        });
      } catch (_) { kiln = null; }
    }

    const shell = createShell({ registry, face, kiln });

    // ── completion cache: refreshed after every command (the editor's Tab is sync). ──
    const KNOWN = ['cd', 'pwd', 'ls', 'cat', 'echo', 'printf', 'grep', 'rg', 'sed', 'awk', 'diff',
      'find', 'head', 'tail', 'wc', 'sort', 'uniq', 'cut', 'tr', 'tee', 'xargs', 'basename', 'dirname',
      'test', 'touch', 'mkdir', 'rm', 'mv', 'cp', 'chmod', 'stat', 'git', 'python',
      'env', 'export', 'unset', 'clear', 'history', 'help', 'which',
      'agent', 'use-folder', 'use-memory'];
    let dirCache = {};
    async function refreshCache() {
      const here = await face.invoke('fs.list', { path: shell.cwd });
      dirCache = { '': here.ok ? here.entries.map((e) => e.name) : [] };
    }
    const complete = createCompleter({ commands: KNOWN, listPath: (d) => dirCache[d] || [] });
    const editor = createLineEditor({ complete });

    // ── xterm chrome ──
    const term = new Terminal({
      fontFamily: 'IBM Plex Mono, ui-monospace, monospace',
      fontSize: 13, lineHeight: 1.35, cursorBlink: true, convertEol: false,
      theme: {
        background: '#0E1012', foreground: '#E6E9EB', cursor: '#D98A28',
        cursorAccent: '#0E1012', selectionBackground: '#242A2F',
        black: '#15181B', red: '#C2564B', green: '#5C9E6B', yellow: '#C9A227',
        blue: '#6E9ECF', magenta: '#B07FC9', cyan: '#5FA8A8', white: '#A8B0B6',
        brightBlack: '#6E777D', brightWhite: '#E6E9EB',
      },
    });
    const fit = new FitAddon();
    term.loadAddon(fit);
    const host = document.getElementById('term');
    term.open(host);
    // Fit to the container once it has real dimensions; fall back to 80x24 so a
    // momentarily-collapsed layout never leaves an unusable 2-column terminal.
    function doFit() {
      try {
        if (host.clientWidth > 40 && host.clientHeight > 20) fit.fit();
        else if (term.cols < 20) term.resize(80, 24);
      } catch (_) { try { term.resize(80, 24); } catch (__) {} }
    }
    new ResizeObserver(doFit).observe(host);
    requestAnimationFrame(doFit);
    setTimeout(doFit, 150);
    addEventListener('resize', doFit);

    const cwdEl = document.getElementById('cwd');
    function promptFor() { return `${ACCENT}/${shell.cwd}${RESET} $ `; }
    function syncPrompt() { editor.setPrompt(promptFor()); cwdEl.textContent = '/' + shell.cwd; }
    function writePrompt() { term.write(editor.prompt()); }

    const RED = '\x1b[38;2;194;86;75m';
    const toCRLF = (s) => String(s == null ? '' : s).replace(/[\x00-\x08\x0b-\x1f\x7f]/g, '').replace(/\n/g, '\r\n');

    // The model side of the agent loop: the host inference tier (agent scope),
    // reached through the SDK. Forge is a system app, so the broker grants it the
    // raised caps + tool-calling. Degrades honestly when no host / model is set.
    async function inferViaHost({ messages, tools }) {
      const nakAI = window.naklios && window.naklios.ai;
      if (!nakAI) throw new Error('Agent needs the NakliOS host — open Forge inside NakliOS.');
      // Retry transient upstream hiccups (a real run hit a one-off 405 from the
      // provider mid-loop). Config/auth errors (400/401/403) are not retried.
      let lastErr;
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const completion = await nakAI.chat.completions.create({
            agent: true, messages, tools, tool_choice: 'auto', stream: false,
          });
          const choice = completion && completion.choices && completion.choices[0];
          const msg = (choice && choice.message) || {};
          return {
            content: typeof msg.content === 'string' ? msg.content : '',
            toolCalls: Array.isArray(msg.tool_calls) ? msg.tool_calls : [],
            finishReason: (choice && choice.finish_reason) || 'stop',
          };
        } catch (e) {
          lastErr = e;
          const m = String((e && e.message) || e);
          const transient = /\b(405|408|409|425|429|5\d\d)\b/.test(m) || /timeout|network|temporarily|fetch/i.test(m);
          if (transient && attempt < 2) { await new Promise((r) => setTimeout(r, 400 * (attempt + 1))); continue; }
          throw e;
        }
      }
      throw lastErr;
    }

    // `agent "<task>"` — a tool-using coding agent over this workspace. The model
    // drives the same shell you type into; every tool call is echoed live.
    async function runAgent(task) {
      if (!task.trim()) {
        term.write(`${DIM}usage: agent "<task>"  — a tool-using agent over your files (needs a model in Settings → AI)${RESET}\r\n`);
        return;
      }
      term.write(`${ACCENT}◆ agent${RESET} ${DIM}${task}${RESET}\r\n`);
      const result = await runAgentLoop({
        messages: [
          { role: 'system', content:
            'You are a coding agent working over the user\'s files. You have tools: ' +
            'read (line-numbered), write (whole file), edit (surgical old_string→new_string), ' +
            'apply_patch (add/update/delete files), and shell (bash-style: ls, cat, grep, sed, git, pipes). ' +
            'Prefer edit/apply_patch for changing existing files and write for new ones; use shell to explore, run git, and verify. ' +
            'Work in small, verifiable steps; when the task is complete, give a one-line summary.' },
          { role: 'user', content: task },
        ],
        tools: codingToolset(),
        infer: inferViaHost,
        executeTool: makeToolExecutor({ shell, face }),
        maxSteps: 24,
        onEvent: (e) => {
          if (e.type === 'tool-call') {
            const a = e.args || {};
            const detail = a.command || a.path || a.old_string || (a.patch ? 'patch' : '') || e.name;
            term.write(`${DIM}→ ${e.name === 'shell' ? '' : e.name + ' '}${String(detail).split('\n')[0].slice(0, 100)}${RESET}\r\n`);
          }
          else if (e.type === 'tool-result') { const s = toCRLF(e.result); if (s) term.write(`${s}\r\n`); }
          else if (e.type === 'tool-error') term.write(`${RED}${e.error}${RESET}\r\n`);
          else if (e.type === 'assistant' && e.content) term.write(`${toCRLF(e.content)}\r\n`);
          else if (e.type === 'error') term.write(`${RED}agent: ${e.error}${RESET}\r\n`);
        },
      });
      const tag = result.stop === 'done' ? `${ACCENT}done${RESET}` : `${DIM}${result.stop}${RESET}`;
      term.write(`${DIM}agent ${RESET}${tag}${DIM} · ${result.steps} steps${RESET}\r\n`);
      await refreshCache();
    }

    async function runCommand(line) {
      if (line.trim() === '') { writePrompt(); return; }
      // `agent …` is a Forge-level command (it needs host inference), handled
      // before the shell — the shell core stays free of any AI dependency.
      const agentMatch = line.trim().match(/^agent(?:\s+([\s\S]+))?$/);
      if (agentMatch) {
        const task = (agentMatch[1] || '').replace(/^\s*["']|["']\s*$/g, '');
        try { await runAgent(task); }
        catch (e) { term.write(`${RED}agent: ${String(e && e.message || e)}${RESET}\r\n`); }
        syncPrompt(); writePrompt();
        if (nak && nak.title) nak.title(`Forge — /${shell.cwd}`);
        return;
      }
      // Workspace backend commands (Forge-level: they reload the app).
      const cmd0 = line.trim().split(/\s+/)[0];
      if (cmd0 === 'use-folder' || cmd0 === 'open-folder') {
        try {
          if (!window.showDirectoryPicker) { term.write(`${RED}use-folder: this browser has no File System Access${RESET}\r\n`); }
          else {
            const h = await window.showDirectoryPicker({ mode: 'readwrite' });
            await idbSet(DIR_KEY, h);
            term.write(`${DIM}workspace → folder "${h.name}". Reloading…${RESET}\r\n`);
            setTimeout(() => location.reload(), 400);
            return;
          }
        } catch (e) { term.write(`${RED}use-folder: ${String(e && e.message || e)}${RESET}\r\n`); }
        writePrompt(); return;
      }
      if (cmd0 === 'use-memory') {
        await idbDel(DIR_KEY);
        term.write(`${DIM}workspace → memory scratch. Reloading…${RESET}\r\n`);
        setTimeout(() => location.reload(), 400);
        return;
      }
      // First `python`: announce the one-time Pyodide download so the wait is explained.
      if (/^(python|py)\b/.test(line.trim()) && kiln && !pyAnnounced && kiln.status && kiln.status() !== 'ready') {
        pyAnnounced = true;
        term.write(`${DIM}◆ Kiln: loading Pyodide (~12 MB, first run only)…${RESET}\r\n`);
      }
      let res;
      try { res = await shell.feed(line); }
      catch (e) { term.write(`\x1b[38;2;194;86;75m${String(e && e.message || e)}${RESET}\r\n`); res = { output: '' }; }
      if (res.cleared) term.clear();
      // Shell output is plain text (the app adds its own colour separately), so
      // scrub every C0 control except tab/newline before writing — a file whose
      // bytes contain ANSI/OSC escapes can't then drive the terminal (matters
      // once external content, not just this scratch workspace, can land).
      if (res.output) {
        const safe = res.output.replace(/[\x00-\x08\x0b-\x1f\x7f]/g, '').replace(/\n/g, '\r\n');
        term.write(safe + '\r\n');
      }
      await refreshCache();
      syncPrompt();
      writePrompt();
      if (nak && nak.title) nak.title(`Forge — /${shell.cwd}`);
    }

    term.onData(async (d) => {
      const r = editor.feed(d);
      if (r.output) term.write(r.output);
      if (r.clear) { term.clear(); writePrompt(); return; }
      if (r.interrupt) { writePrompt(); return; }
      if (r.submit != null) await runCommand(r.submit);
    });

    // Decode a data-seq attribute into its control bytes. JSON.parse chokes on
    // \x escapes (JSON has none), so handle \x / \u / \t / \r / \n ourselves.
    function unescapeSeq(s) {
      return String(s == null ? '' : s)
        .replace(/\\x([0-9a-fA-F]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16)))
        .replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16)))
        .replace(/\\t/g, '\t').replace(/\\r/g, '\r').replace(/\\n/g, '\n');
    }
    // Mobile key bar → feed the raw sequence as if typed.
    document.getElementById('keybar').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const seq = unescapeSeq(b.dataset.seq);
      term.focus();
      const r = editor.feed(seq);
      if (r.output) term.write(r.output);
      if (r.submit != null) runCommand(r.submit);
    });

    // ── banner + first prompt ──
    term.writeln(`${ACCENT}◆ Forge${RESET} — a bash-style terminal over your files.`);
    term.writeln(`${DIM}workspace: ${RESET}${workspaceLabel}${DIM}  ·  python: ${RESET}${kiln ? 'ready (run ' + ACCENT + 'python' + RESET + ')' : DIM + 'off (needs an isolated tab)'}${RESET}`);
    term.writeln(`${DIM}Type ${RESET}help${DIM}, ${RESET}use-folder${DIM} to persist to a real folder, or ${RESET}agent "<task>"${DIM} for a coding agent.${RESET}`);
    await refreshCache();
    syncPrompt();
    writePrompt();
    term.focus();

    if (nak && nak.ready) nak.ready();
    if (nak && nak.title) nak.title('Forge');
    if (nak && nak.theme && nak.theme.onChange) {
      // Forge owns its own dark palette; ignore host theme swaps for now.
    }
  </script>
</body>
</html>
