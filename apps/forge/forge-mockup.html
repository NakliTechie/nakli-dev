<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forge — UX mockup v0.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0E1012; --bg-1:#15181B; --bg-2:#1C2024; --bg-3:#242A2F;
  --fg-0:#E6E9EB; --fg-1:#A8B0B6; --fg-2:#6E777D; --rule:#262C31;
  --accent:#D98A28; --accent-dim:#8A5A1C;
  --ok:#5C9E6B; --warn:#C9A227; --err:#C2564B; --add:#3F6B4A; --del:#6B3F3F;
  --s-1:2px; --s-2:4px; --s-3:8px; --s-4:12px; --s-5:16px; --s-6:24px;
  --radius:3px; --rule-w:1px;
  --dur:120ms; --ease:cubic-bezier(.2,0,0,1);
  --font-ui:"IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --text-xs:11px; --text-sm:12px; --text-md:13px; --text-lg:15px; --text-xl:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08090A;color:var(--fg-0);font-family:var(--font-mono);font-size:var(--text-sm);
  -webkit-font-smoothing:antialiased;padding:var(--s-6);min-height:100vh}

/* ── mockup chrome (not part of the product) ───────────────────── */
.meta{max-width:1440px;margin:0 auto var(--s-5);font-family:var(--font-ui)}
.meta h1{font-size:var(--text-lg);font-weight:600;letter-spacing:.01em}
.meta p{color:var(--fg-2);font-size:var(--text-sm);margin-top:var(--s-2);max-width:70ch;line-height:1.5}
.switch{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-top:var(--s-4)}
.switch button{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-1);
  background:var(--bg-1);border:var(--rule-w) solid var(--rule);border-radius:var(--radius);
  padding:var(--s-2) var(--s-3);cursor:pointer;transition:color var(--dur) var(--ease)}
.switch button:hover{color:var(--fg-0)}
.switch button[aria-pressed=true]{color:var(--accent);border-color:var(--accent-dim)}
.stage{max-width:1440px;margin:0 auto}
.note{font-family:var(--font-ui);color:var(--fg-2);font-size:var(--text-xs);margin-top:var(--s-3);line-height:1.6}

/* ── app frame ─────────────────────────────────────────────────── */
.app{background:var(--bg-0);border:var(--rule-w) solid var(--rule);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column}
.app.desktop{height:800px}
.app.mobile{height:844px;width:390px;margin:0 auto}

/* header */
.hdr{height:40px;flex:0 0 40px;display:flex;align-items:center;gap:var(--s-4);
  padding:0 var(--s-4);border-bottom:var(--rule-w) solid var(--rule);background:var(--bg-1)}
.hdr .repo{color:var(--fg-0);font-weight:500}
.hdr .branch{color:var(--accent)}
.hdr .staged{color:var(--fg-1)}
.hdr .sp{flex:1}
.hdr .key{color:var(--fg-2);font-size:var(--text-xs)}
.hdr .ver{color:var(--fg-2);font-size:var(--text-xs)}

/* body */
.body{flex:1;display:flex;min-height:0}
.col{display:flex;flex-direction:column;min-height:0}
.tree{flex:0 0 260px;border-right:var(--rule-w) solid var(--rule);overflow:auto;padding:var(--s-3) 0}
.centre{flex:1;min-width:0;overflow:auto}
.rail{flex:0 0 340px;border-left:var(--rule-w) solid var(--rule);overflow:auto}

.sect{border-bottom:var(--rule-w) solid var(--rule);padding:var(--s-4)}
.sect h2{font-size:var(--text-xs);font-weight:500;color:var(--fg-2);letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:var(--s-3)}

/* tree rows */
.row{height:22px;display:flex;align-items:center;gap:var(--s-2);padding:0 var(--s-4);
  color:var(--fg-1);white-space:nowrap;position:relative}
.row .ind{display:inline-block}
.row.dir{color:var(--fg-0)}
.row.sel{background:var(--bg-3);color:var(--fg-0)}
.row.dim{color:var(--fg-2);opacity:.45}
.row.touched::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:2px;background:var(--accent)}

/* diff */
.diffhdr{padding:var(--s-3) var(--s-4);border-bottom:var(--rule-w) solid var(--rule);
  color:var(--fg-1);display:flex;gap:var(--s-4);align-items:baseline}
.diffhdr .path{color:var(--fg-0)}
.diffhdr .stat{color:var(--fg-2);font-size:var(--text-xs)}
.diff{font-size:var(--text-sm);line-height:1.55}
.dl{display:flex;padding:0 var(--s-4)}
.dl .n{flex:0 0 44px;color:var(--fg-2);text-align:right;padding-right:var(--s-4);user-select:none}
.dl.add{background:color-mix(in srgb,var(--add) 26%,transparent)}
.dl.del{background:color-mix(in srgb,var(--del) 26%,transparent)}
.dl.hunk{color:var(--fg-2)}
.k{color:#8FA8C8}.s{color:#B5926A}.c{color:var(--fg-2)}

/* transcript */
.tr{font-family:var(--font-ui);font-size:var(--text-md);line-height:1.55;color:var(--fg-1)}
.tr .who{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-2);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:var(--s-2)}
.tr p{margin-bottom:var(--s-3)}
.cell{font-family:var(--font-mono);font-size:var(--text-xs);background:var(--bg-1);
  border-left:2px solid var(--accent-dim);padding:var(--s-3);margin-bottom:var(--s-3);
  color:var(--fg-1);white-space:pre;overflow-x:auto}

/* git panel */
.gitrow{display:flex;align-items:center;gap:var(--s-3);height:22px;color:var(--fg-1)}
.gitrow .m{width:12px;color:var(--fg-2)}
.gitrow .m.a{color:var(--ok)}.gitrow .m.d{color:var(--err)}.gitrow .m.mo{color:var(--warn)}
.grp{margin-bottom:var(--s-4)}
.grp .gh{font-size:var(--text-xs);color:var(--fg-2);margin-bottom:var(--s-2)}
.grp .gh .id{color:var(--accent)}
.btn{font-family:var(--font-mono);font-size:var(--text-xs);padding:var(--s-2) var(--s-3);
  border-radius:var(--radius);border:var(--rule-w) solid var(--rule);background:var(--bg-2);
  color:var(--fg-1);cursor:pointer}
.btn.pri{border-color:var(--accent-dim);color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:default}
.btnrow{display:flex;gap:var(--s-2);margin-top:var(--s-3)}

/* run panel */
.runline{color:var(--fg-1);white-space:pre-wrap;font-size:var(--text-xs);line-height:1.5}
.verdict{margin-top:var(--s-3);font-size:var(--text-xs)}
.verdict.pass{color:var(--ok)}.verdict.fail{color:var(--err)}
.fresh{color:var(--fg-2);font-size:var(--text-xs);margin-top:var(--s-2)}

/* terminal drawer */
.term{flex:0 0 200px;border-top:var(--rule-w) solid var(--rule);background:var(--bg-0);
  padding:var(--s-3) var(--s-4);overflow:auto;font-size:var(--text-sm);line-height:1.5;color:var(--fg-1)}
.term .p{color:var(--accent)}
.caret{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px}

/* status bar */
.status{height:28px;flex:0 0 28px;display:flex;align-items:center;gap:var(--s-5);
  padding:0 var(--s-4);border-top:var(--rule-w) solid var(--rule);background:var(--bg-1);
  color:var(--fg-1);font-size:var(--text-xs)}
.status .lbl{color:var(--fg-2)}
.status .on{color:var(--accent)}

/* empty states */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-4);padding:var(--s-6)}
.empty p{font-family:var(--font-ui);font-size:var(--text-lg);color:var(--fg-1);text-align:center}
.empty .sub{font-size:var(--text-sm);color:var(--fg-2)}

/* goal board */
.step{display:flex;gap:var(--s-3);align-items:baseline;height:22px;color:var(--fg-1)}
.step .g{width:12px;color:var(--fg-2)}
.step.now{color:var(--fg-0)}.step.now .g{color:var(--accent)}
.step.done .g{color:var(--ok)}
.step.fail .g{color:var(--err)}
.trail{font-size:var(--text-xs);color:var(--fg-2);line-height:1.6;margin-top:var(--s-3)}
.trail b{color:var(--err);font-weight:500}

/* mobile */
.msurf{flex:1;overflow:auto;min-height:0}
.mbar{height:32px;flex:0 0 32px;display:flex;align-items:center;gap:var(--s-3);padding:0 var(--s-4);
  border-top:var(--rule-w) solid var(--rule);background:var(--bg-1);font-size:var(--text-xs);color:var(--fg-1)}
.msw{height:52px;flex:0 0 52px;display:flex;border-top:var(--rule-w) solid var(--rule);background:var(--bg-1)}
.msw button{flex:1;background:none;border:0;color:var(--fg-2);font-family:var(--font-mono);
  font-size:var(--text-xs);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer}
.msw button .ic{font-size:15px}
.msw button[aria-pressed=true]{color:var(--accent)}
.mobile .row{height:40px;font-size:var(--text-md)}
.mobile .dl{font-size:var(--text-md)}
.keybar{display:flex;gap:var(--s-2);padding:var(--s-2) var(--s-4);border-top:var(--rule-w) solid var(--rule)}
.keybar .btn{flex:1;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="meta">
  <h1>Forge — UX mockup v0.1</h1>
  <p>Unity: <em>an instrument you own — the repository itself, dense and legible, with the agent working inside it rather than beside it.</em> Tokens, layout, and states as specified in FORGE-UX-UI-REFERENCE.md. Click through the states.</p>
  <div class="switch" id="sw"></div>
</div>

<div class="stage" id="stage"></div>
<div class="meta"><p class="note" id="note"></p></div>

<script>
const TREE = [
  ['dir',0,'▾ src',''],['file',1,'  main.py','sel'],['file',1,'  config.py',''],
  ['file',1,'  auth.py',''],['dir',1,'  ▾ api',''],['file',2,'    routes.py',''],
  ['file',2,'    schema.py',''],['dir',0,'▾ tests',''],['file',1,'  test_api.py',''],
  ['file',1,'  test_auth.py',''],['dir',0,'▸ docs','dim'],['file',0,'pyproject.toml','dim'],
  ['file',0,'README.md','dim']
];

function tree(touched){
  return TREE.map(([k,d,t,c])=>{
    let cls='row '+(k==='dir'?'dir ':'')+(c||'');
    if(touched&&(t.includes('routes.py')||t.includes('schema.py')))cls+=' touched';
    return `<div class="${cls}">${t}</div>`;
  }).join('');
}

const DIFF=`<div class="diffhdr"><span class="path">src/api/routes.py</span><span class="stat">+9 −2</span></div>
<div class="diff">
<div class="dl hunk"><span class="n"></span>@@ -41,7 +41,14 @@ def register(app):</div>
<div class="dl"><span class="n">41</span>     <span class="k">def</span> register(app):</div>
<div class="dl del"><span class="n">42</span> -    app.route(<span class="s">"/v1/items"</span>)(list_items)</div>
<div class="dl del"><span class="n">43</span> -    <span class="c"># TODO: v2</span></div>
<div class="dl add"><span class="n">42</span> +    app.route(<span class="s">"/v1/items"</span>)(list_items)</div>
<div class="dl add"><span class="n">43</span> +    app.route(<span class="s">"/v2/items"</span>)(list_items_v2)</div>
<div class="dl add"><span class="n">44</span> +</div>
<div class="dl add"><span class="n">45</span> +<span class="k">def</span> list_items_v2(req):</div>
<div class="dl add"><span class="n">46</span> +    page = req.query.get(<span class="s">"page"</span>, <span class="s">1</span>)</div>
<div class="dl add"><span class="n">47</span> +    <span class="k">return</span> paginate(store.all(), page)</div>
<div class="dl"><span class="n">48</span>  </div>
<div class="dl"><span class="n">49</span>     <span class="k">return</span> app</div>
</div>`;

const TRANSCRIPT=`<div class="sect"><h2>transcript</h2><div class="tr">
<div class="who">step 3 · agent</div>
<p>Adding the v2 route and a paginating handler. Checking the existing schema first.</p>
<div class="cell">m = rig_map(cwd="src/api")
sigs = [s for s in m.symbols if "items" in s.name]
print(sigs)</div>
<p>Two call sites, both v1. Writing the handler and the route together.</p>
<div class="cell">rig.patch("src/api/routes.py", diff)
rig.patch("src/api/schema.py", diff2)</div>
<p>Staged. Running the suite.</p>
</div></div>`;

const GIT=(agent)=>`<div class="sect"><h2>git</h2>
${agent?`<div class="grp"><div class="gh">staged by <span class="id">agent@rig.local</span> · session 4f2a</div>
<div class="gitrow"><span class="m mo">M</span>src/api/routes.py</div>
<div class="gitrow"><span class="m mo">M</span>src/api/schema.py</div>
<div class="btnrow"><button class="btn pri">Accept</button><button class="btn">Reject</button><button class="btn" disabled>Commit</button></div>
</div>`:''}
<div class="grp"><div class="gh">unstaged</div>
<div class="gitrow"><span class="m mo">M</span>src/main.py</div>
<div class="gitrow"><span class="m a">A</span>tests/test_v2.py</div>
</div></div>`;

const RUN=(pass)=>`<div class="sect"><h2>run</h2>
<div class="runline">$ pytest -q
${pass?'.......................  23 passed in 1.8s':'....F..................  1 failed, 22 passed\n\ntests/test_v2.py::test_paginate\nE  AssertionError: expected 20 items, got 50'}</div>
<div class="verdict ${pass?'pass':'fail'}">${pass?'✓ exit 0':'✗ exit 1'}</div>
<div class="fresh">fresh kernel · goal 8c11 · verification</div></div>`;

const GOAL=`<div class="sect"><h2>goal</h2>
<div class="tr" style="margin-bottom:12px"><p style="font-size:13px;color:var(--fg-0)">Ship the v2 items endpoint with pagination and tests.</p></div>
<div class="step done"><span class="g">✓</span>1 · map the api module</div>
<div class="step done"><span class="g">✓</span>2 · add v2 schema</div>
<div class="step now"><span class="g">●</span>3 · add route + handler</div>
<div class="step"><span class="g">·</span>4 · write tests</div>
<div class="step"><span class="g">·</span>5 · verify suite green</div>
<div class="trail">tried · <b>3 consecutive failures</b> on step 4<br>
— paginate() default page size 50, expected 20<br>
— patched default, test still red<br>
— reverted, same signal. stopped.</div>
<div class="btnrow"><button class="btn pri">Resume</button><button class="btn">Clear</button></div></div>`;

const TERM=`<div class="term">
<div><span class="p">/</span>git status</div>
<div>on branch <span style="color:var(--accent)">v2-items</span> · 2 staged · 2 unstaged</div>
<div><span class="p">/</span>help git.diff</div>
<div>git.diff(ref?: string) — diff the working tree, or against a ref.</div>
<div><span class="p">/</span>py sigs = rig_map(cwd="src/api").symbols</div>
<div><span class="p">/</span><span class="caret"></span></div>
</div>`;

const STATUS=(t)=>`<div class="status">${t}</div>`;

function desktop({touched=false,agent=false,goal=false,pass=false,model=true,term=false,status}){
  return `<div class="app desktop">
  <div class="hdr"><span class="repo">▸ items-api</span><span class="branch">v2-items ⌄</span>
    <span class="staged">● 2 staged</span><span class="sp"></span>
    <span class="key">⌘K</span><span class="ver">forge 0.1.0</span></div>
  <div class="body">
    <div class="col tree">${tree(touched)}</div>
    <div class="col centre">${DIFF}</div>
    <div class="col rail">${model&&agent?TRANSCRIPT:''}${goal?GOAL:''}${GIT(agent)}${RUN(pass)}</div>
  </div>
  ${term?TERM:''}
  ${STATUS(status)}
</div>`;
}

const STATES={
  workbench:{label:'Workbench (no model)',note:'The product with no model configured. The transcript rail is simply absent — not an upsell, not a locked panel. Everything else is identical to the agent view. This is the state the removability guarantee lives in.',
    html:()=>desktop({pass:true,status:'<span class="lbl">no goal</span><span class="lbl">kernel</span> ready<span class="lbl">python</span> 3.12'})},
  agent:{label:'Agent active',note:'Agent output lands in the git panel as a staged change under its own identity — never in a chat window beside the tool. Touched files carry a left-edge accent bar in the tree. Commit stays disabled until the operator accepts.',
    html:()=>desktop({touched:true,agent:true,goal:true,pass:true,status:'<span class="lbl">goal</span> ship v2 endpoint<span class="lbl">step</span> 3/5<span class="on">●</span> verifying<span class="lbl">budget</span> 41%'})},
  blocked:{label:'Goal blocked',note:'The no-progress exit, surfaced. Three identical failures on one step stops the loop and shows the tried-trail worst-first. The operator resumes or clears; the model cannot decide it is done.',
    html:()=>desktop({touched:true,agent:true,goal:true,pass:false,status:'<span class="lbl">goal</span> ship v2 endpoint<span class="lbl">step</span> 4/5<span style="color:var(--err)">✗</span> blocked<span class="lbl">budget</span> 63%'})},
  terminal:{label:'Terminal open',note:'xterm.js chrome over the faux CLI. No shell, no PTY — every line resolves through the Rig command registry. /py forwards to the same Kiln namespace the model uses, with operator provenance.',
    html:()=>desktop({touched:true,agent:true,pass:true,term:true,status:'<span class="lbl">goal</span> ship v2 endpoint<span class="lbl">step</span> 3/5<span class="on">●</span> active<span class="lbl">budget</span> 41%'})},
  norepo:{label:'No repo',note:'One line, two actions, no mascot and no onboarding theater. Help and the version string live here, not only in the toolbar.',
    html:()=>`<div class="app desktop">
      <div class="hdr"><span class="repo">▸ forge</span><span class="sp"></span><span class="key">?</span><span class="ver">forge 0.1.0</span></div>
      <div class="body"><div class="empty">
        <p>Open a folder, or clone one.</p>
        <div class="btnrow"><button class="btn pri">Open folder</button><button class="btn">Clone…</button></div>
        <p class="sub">Everything stays on this machine.</p>
      </div></div>${STATUS('<span class="lbl">no repo</span><span class="lbl">kernel</span> not downloaded')}</div>`},
  nokernel:{label:'No kernel',note:'Degradation is one honest line plus a working product underneath — never an error wall where a feature used to be. Files and git are unaffected; only verification waits.',
    html:()=>`<div class="app desktop">
      <div class="hdr"><span class="repo">▸ items-api</span><span class="branch">v2-items ⌄</span><span class="sp"></span><span class="ver">forge 0.1.0</span></div>
      <div class="body">
        <div class="col tree">${tree(false)}</div>
        <div class="col centre">${DIFF}</div>
        <div class="col rail">${GIT(false)}
          <div class="sect"><h2>run</h2>
            <div class="runline" style="color:var(--fg-1)">Python isn't downloaded yet — about 12 MB, cached after the first time.</div>
            <div class="btnrow"><button class="btn pri">Download</button><button class="btn">Not now</button></div>
          </div></div>
      </div>${STATUS('<span class="lbl">kernel</span> unavailable<span class="lbl">git</span> ready')}</div>`},
  mobile:{label:'Mobile 390×844',note:'Not a squeezed desktop. One surface at a time, a switcher instead of columns, and the editor is read-plus-patch-review only. Priority when space is scarce: goal status, staged diff, run verdict — what a person opens a phone to see.',
    html:()=>`<div class="app mobile">
      <div class="hdr" style="height:44px;flex:0 0 44px"><span class="repo">▸ items-api</span><span class="branch">v2-items ⌄</span><span class="sp"></span><span class="key">⋯</span></div>
      <div class="msurf">
        <div class="diffhdr"><span class="path">routes.py</span><span class="stat">+9 −2</span></div>
        <div class="diff">
          <div class="dl hunk"><span class="n"></span>@@ -41,7 +41,14 @@</div>
          <div class="dl del"><span class="n">42</span> -  app.route(<span class="s">"/v1"</span>)</div>
          <div class="dl add"><span class="n">42</span> +  app.route(<span class="s">"/v1"</span>)</div>
          <div class="dl add"><span class="n">43</span> +  app.route(<span class="s">"/v2"</span>)</div>
          <div class="dl add"><span class="n">44</span> +</div>
          <div class="dl add"><span class="n">45</span> +<span class="k">def</span> list_v2(req):</div>
          <div class="dl add"><span class="n">46</span> +  <span class="k">return</span> paginate(...)</div>
        </div>
        <div class="sect"><div class="gh" style="font-size:11px;color:var(--fg-2);margin-bottom:8px">staged by <span style="color:var(--accent)">agent@rig.local</span></div>
          <div class="btnrow"><button class="btn pri" style="flex:1">Accept</button><button class="btn" style="flex:1">Reject</button></div></div>
      </div>
      <div class="mbar"><span>goal · step 3/5</span><span class="sp" style="flex:1"></span><span class="on" style="color:var(--accent)">●</span><span>41%</span></div>
      <div class="msw">
        <button><span class="ic">⌂</span>tree</button>
        <button aria-pressed="true"><span class="ic">⑂</span>git</button>
        <button><span class="ic">▶</span>run</button>
        <button><span class="ic">◆</span>goal</button>
        <button><span class="ic">⌨</span>term</button>
      </div>
    </div>`}
};

const sw=document.getElementById('sw'),stage=document.getElementById('stage'),note=document.getElementById('note');
Object.entries(STATES).forEach(([k,v])=>{
  const b=document.createElement('button');b.textContent=v.label;b.dataset.k=k;
  b.setAttribute('aria-pressed',k==='agent');b.onclick=()=>render(k);sw.appendChild(b);
});
function render(k){
  stage.innerHTML=STATES[k].html();
  note.textContent=STATES[k].note;
  [...sw.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
}
render('agent');
</script>
</body>
</html>
