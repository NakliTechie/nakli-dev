<!doctype html>
<meta charset="utf-8">
<title>Anvil</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg-0:#0E1012; --bg-1:#15181B; --bg-2:#1C2024; --bg-3:#242A2F;
    --fg-0:#E6E9EB; --fg-1:#A8B0B6; --fg-2:#6E777D; --rule:#262C31;
    --accent:#D98A28; --accent-dim:#8A5A1C; --err:#C2564B; --ok:#5C9E6B;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --ui:"IBM Plex Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  *{scrollbar-width:thin;scrollbar-color:var(--accent-dim) transparent}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:var(--accent-dim);border:2px solid transparent;border-radius:999px;background-clip:padding-box}
  *::-webkit-scrollbar-thumb:hover{background:var(--accent)}
  html,body{height:100%;margin:0}
  body{background:var(--bg-0);color:var(--fg-0);font-family:var(--ui);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
  button{font-family:var(--ui);font-size:12px;color:var(--fg-1);background:var(--bg-2);border:1px solid var(--rule);border-radius:5px;padding:4px 9px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.icon{padding:4px 7px;line-height:1}

  /* header */
  header{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--rule);background:var(--bg-1);flex:0 0 auto}
  header .brand{font-weight:600} header .brand b{color:var(--accent)}
  header .sub{color:var(--fg-2);font-size:11px}
  header .ws{color:var(--fg-2);font-family:var(--mono);font-size:11px;margin-left:6px;padding:2px 7px;border:1px solid var(--rule);border-radius:999px}
  header .spacer{flex:1}

  /* three-pane grid */
  main{flex:1;display:grid;grid-template-columns:var(--left,248px) 1fr 0;min-height:0;transition:grid-template-columns .16s ease}
  main.preview-open{grid-template-columns:var(--left,248px) 1fr var(--pw,440px)}

  /* left pane — projects & tasks */
  #left{background:var(--bg-1);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;overflow:hidden}
  #left .lhead{display:flex;align-items:center;gap:6px;padding:9px 12px 6px;color:var(--fg-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  #left .lhead .spacer{flex:1}
  #projects{flex:1;overflow:auto;padding:2px 0 8px}
  .proj{margin:0}
  .proj > .prow{display:flex;align-items:center;gap:6px;padding:5px 12px;cursor:pointer;color:var(--fg-0);font-weight:600;font-size:12px;user-select:none}
  .proj > .prow:hover{background:var(--bg-2)}
  .proj .tw{color:var(--fg-2);width:1em;display:inline-block;text-align:center;flex:0 0 auto}
  .proj .pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .proj .pcount{color:var(--fg-2);font-weight:400;font-family:var(--mono);font-size:10px}
  .task{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 30px;cursor:pointer;color:var(--fg-1);font-size:12px;user-select:none;border-left:2px solid transparent}
  .task:hover{background:var(--bg-2)}
  .task.active{background:var(--bg-3);color:var(--fg-0);border-left-color:var(--accent)}
  .task .ttitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .dot{width:7px;height:7px;border-radius:999px;flex:0 0 auto;background:var(--fg-2)}
  .dot.running{background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 1.2s infinite}
  .dot.done{background:var(--ok)} .dot.error{background:var(--err)} .dot.idle{background:var(--fg-2)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,138,40,.5)}70%{box-shadow:0 0 0 5px rgba(217,138,40,0)}100%{box-shadow:0 0 0 0 rgba(217,138,40,0)}}
  #left .lfoot{border-top:1px solid var(--rule);padding:8px;display:flex;gap:6px}
  #left .lfoot button{flex:1}

  /* center — chat */
  #center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-0)}
  #taskbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--rule);background:var(--bg-1);flex:0 0 auto}
  #taskbar .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #taskbar .meta{color:var(--fg-2);font-family:var(--mono);font-size:11px}
  #taskbar .spacer{flex:1}
  #log{flex:1;overflow:auto;padding:16px 0}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}
  .msg{margin:0 0 14px}
  .msg .who{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);margin-bottom:3px}
  .msg.user .who{color:var(--accent)}
  .msg .body{white-space:pre-wrap;word-wrap:break-word;line-height:1.5}
  .msg.user .body{background:var(--bg-2);border:1px solid var(--rule);border-radius:8px;padding:8px 11px}
  .msg.system .body{color:var(--fg-2);font-size:12px;border-left:2px solid var(--accent-dim);padding-left:10px}
  .tool{font-family:var(--mono);font-size:11.5px;border:1px solid var(--rule);border-radius:7px;margin:0 0 10px;overflow:hidden;background:var(--bg-1)}
  .tool summary{padding:6px 10px;cursor:pointer;color:var(--fg-1);display:flex;align-items:center;gap:8px;list-style:none}
  .tool summary::-webkit-details-marker{display:none}
  .tool summary .tn{color:var(--accent)} .tool summary .td{color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .tool summary .tg{color:var(--fg-2);font-size:10px}
  .tool .tout{border-top:1px solid var(--rule);padding:8px 10px;white-space:pre-wrap;color:var(--fg-1);max-height:280px;overflow:auto;background:var(--bg-0)}
  .tool.err summary .tn{color:var(--err)}
  #log .empty{max-width:560px;margin:8vh auto 0;text-align:center;color:var(--fg-2);padding:0 20px}
  #log .empty h2{color:var(--fg-1);font-weight:600;font-size:15px;margin:0 0 8px}
  /* markdown, copy buttons, change chips */
  .msg .mhead{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .msg .mhead .who{margin-bottom:0;flex:1}
  .msg.assistant .body{line-height:1.5}
  .md-p{white-space:pre-wrap;word-wrap:break-word;line-height:1.5;margin:0 0 8px}
  .md-p:last-child{margin-bottom:0}
  .body code.inline{font-family:var(--mono);font-size:.92em;background:var(--bg-2);border:1px solid var(--rule);border-radius:4px;padding:0 4px}
  .body strong{color:var(--fg-0);font-weight:600}
  .code{border:1px solid var(--rule);border-radius:7px;overflow:hidden;margin:8px 0;background:var(--bg-1)}
  .code-head{display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:10px;color:var(--fg-2)}
  .code-head .lang{flex:1;text-transform:uppercase;letter-spacing:.05em}
  .code pre{margin:0;padding:9px 11px;overflow:auto;max-height:420px}
  .code code{font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--fg-0);white-space:pre}
  .copybtn{font-family:var(--ui);font-size:10px;color:var(--fg-2);background:var(--bg-2);border:1px solid var(--rule);border-radius:4px;padding:2px 7px;cursor:pointer;flex:0 0 auto}
  .copybtn:hover{border-color:var(--accent);color:var(--accent)}
  .copybtn.ok{color:var(--ok);border-color:var(--ok)}
  .change{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:6px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--bg-1);font-family:var(--mono);font-size:11.5px;color:var(--fg-1);cursor:pointer}
  .change:hover{border-color:var(--accent);color:var(--fg-0)}
  .change .ci{color:var(--accent);flex:0 0 auto} .change .cf{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .change .cv{color:var(--fg-2);margin-left:auto;padding-left:8px;flex:0 0 auto}
  .msg.queued{opacity:.5} .msg.queued .who{color:var(--accent)}
  /* composer */
  #composer{flex:0 0 auto;border-top:1px solid var(--rule);background:var(--bg-1);padding:10px 20px 12px}
  #composer .cwrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
  #composer .crow{display:flex;gap:8px;align-items:flex-end}
  #prompt{flex:1;resize:none;min-height:38px;max-height:180px;background:var(--bg-0);color:var(--fg-0);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;font-family:var(--ui);font-size:13px;line-height:1.45;outline:0}
  #prompt:focus{border-color:var(--accent-dim)}
  #send{background:var(--accent);color:#161009;border:0;font-weight:600;padding:9px 16px;border-radius:8px}
  #send:hover{filter:brightness(1.08)} #send:disabled{opacity:.5;cursor:default}
  #composer .hint{color:var(--fg-2);font-size:10.5px;display:flex;gap:12px}
  #composer .mode{color:var(--fg-2);background:transparent;border:0;font-family:var(--mono);font-size:10.5px;cursor:pointer;padding:0}
  #composer .mode.on{color:var(--accent)}

  /* right — preview */
  #preview{background:var(--bg-1);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;overflow:hidden}
  #preview .phead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule);flex:0 0 auto}
  #preview .phead .pt{font-weight:600;font-size:12px} #preview .phead .pf{color:var(--fg-2);font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  #preview .pbody{flex:1;min-height:0;overflow:auto}
  #preview iframe{width:100%;height:100%;border:0;background:#fff}
  #preview pre{margin:0;padding:12px;font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre-wrap;color:var(--fg-0)}
  #preview pre .add{color:var(--ok)} #preview pre .del{color:var(--err)} #preview pre .hd{color:var(--fg-2)}
  #preview .pempty{color:var(--fg-2);text-align:center;padding:40px 20px}

  @media (max-width:820px){ main,main.preview-open{grid-template-columns:1fr} #left,#preview{display:none} }
</style>

<header>
  <span class="brand"><b>◆</b> Anvil</span>
  <span class="sub">agent workspace</span>
  <span class="ws" id="ws">memory · scratch</span>
  <span class="spacer"></span>
  <button id="open-folder" title="Point the agent at a real folder">Open folder</button>
  <button class="icon" id="toggle-preview" title="Toggle preview">▢</button>
</header>

<main id="main">
  <aside id="left">
    <div class="lhead"><span>Projects</span><span class="spacer"></span><button class="icon" id="new-project" title="New project">＋</button></div>
    <div id="projects"></div>
    <div class="lfoot"><button id="new-task">＋ New task</button></div>
  </aside>

  <section id="center">
    <div id="taskbar">
      <span class="dot idle" id="tb-dot"></span>
      <span class="ttl" id="tb-title">No task</span>
      <span class="spacer"></span>
      <span class="meta" id="tb-meta"></span>
    </div>
    <div id="log"></div>
    <div id="composer">
      <div class="cwrap">
        <div class="crow">
          <textarea id="prompt" placeholder="Describe what you want the agent to do…" rows="1"></textarea>
          <button id="send">Send</button>
        </div>
        <div class="hint">
          <button class="mode" id="mode-btn" title="Cycle mode">mode: code</button>
          <span>↵ send · ⇧↵ newline · queues while running</span>
        </div>
      </div>
    </div>
  </section>

  <aside id="preview">
    <div class="phead"><span class="pt">Preview</span><span class="pf" id="pv-file"></span><button class="icon" id="pv-close" title="Close">✕</button></div>
    <div class="pbody" id="pv-body"><div class="pempty">Nothing to preview yet.<br>Agent output that can be shown appears here.</div></div>
  </aside>
</main>

<!-- The NakliOS host bridge: establishes window.naklios (+ .ai) over postMessage
     when running as a system-app window inside NakliOS. Same as Forge. Standalone
     (window.parent === window) every method no-ops / rejects, so Anvil degrades
     honestly. Loaded as a classic script before the module so window.naklios
     exists when the app boots. -->
<script src="../../sdk/naklios.js"></script>

<script type="module">
  import { createFileops, MemoryBackend } from '../../sys/rig/fileops/index.mjs';
  import { FsaBackend } from '../../sys/rig/fileops/fsa-backend.mjs';
  import { createGitCore } from '../../sys/rig/git/git-core.mjs';
  import { buildRigRegistry } from '../../sys/rig/registry/index.mjs';
  import { createGrant, createOpLog, createAgentFace } from '../../sys/rig/agent/index.mjs';
  import { createShell } from '../../sys/rig/cli/shell.mjs';
  import { runAgentLoop } from '../../sys/ai/agent-loop.mjs';
  import { codingToolset, makeToolExecutor } from '../../sys/ai/agent-tools.mjs';
  import { createKiln, createWorkerRuntime } from '../../sys/kiln/index.mjs';
  import { createFsBridge } from '../../sys/kiln/fs-bridge.mjs';
  import { generateRigModule } from '../../sys/kiln/rig-bindings.mjs';
  import { createMainThreadKiln } from '../../sys/kiln/main-thread-runtime.mjs';

  const $ = (id) => document.getElementById(id);
  const nak = window.naklios || null;

  // ── Rig workspace stack (lifted from Forge) — the agent's file substrate ──
  let backend, fs, git, registry, grant, opLog, face, shell;
  let workspaceLabel = 'memory · scratch';
  function mountWorkspace(newBackend, label){
    backend = newBackend; workspaceLabel = label;
    fs = createFileops({ backend });
    git = createGitCore({ fs, dir:'/' });
    registry = buildRigRegistry({ fs, git });
    grant = createGrant({ prefixes:[''], scopes:['fs:read','fs:write','fs:remove','git:read','git:write'] });
    opLog = createOpLog({ fs: createFileops({ backend:new MemoryBackend() }) });
    face = createAgentFace({ registry, grant, opLog, actor:'agent' });
    // Kiln (Pyodide) — same wiring as Forge. Requires cross-origin isolation
    // (SharedArrayBuffer); available when Anvil is a top-level tab under the
    // /apps/anvil/* COI headers, degrades to "python unavailable" otherwise
    // (e.g. inside NakliOS immersive until the host itself is isolated).
    let kiln = null;
    if (self.crossOriginIsolated === true) {
      // Isolated (standalone tab): the worker Kiln — non-blocking, interruptible.
      try {
        const rigModuleSource = generateRigModule(registry).source;
        const fsBridge = createFsBridge({ backend, mount:'' });
        kiln = createKiln({
          sizeBytes: 12 * 1024 * 1024,
          consent: () => true,
          loadRuntime: () => createWorkerRuntime({ face, fsBridge, rigModuleSource }),
        });
      } catch(_) { kiln = null; }
    }
    if (!kiln) {
      // Not isolated (e.g. inside NakliOS immersive): main-thread Pyodide with a
      // workspace<->MEMFS snapshot — no SharedArrayBuffer, so `python` works in
      // the embedded window too. Reuses one Pyodide across folder remounts.
      try { kiln = createMainThreadKiln({ fs, mount:'work' }); } catch(_) { kiln = null; }
    }
    shell = createShell({ registry, face, kiln });
    $('ws').textContent = label;
  }
  async function seedScratch(){
    await fs.write('README.md', '# Workspace\n\nA scratch workspace the agent can read and write.\nOpen a real folder to work on your files.\n');
  }
  mountWorkspace(new MemoryBackend(), 'memory · scratch');
  await seedScratch();

  // ── Folder persistence (IndexedDB), lifted from Forge ──
  const DIR_DB='anvil-fs', DIR_STORE='h', DIR_KEY='workspace-dir';
  function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DIR_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(DIR_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
  async function idbGet(k){try{const db=await idbOpen();return await new Promise((res)=>{const t=db.transaction(DIR_STORE).objectStore(DIR_STORE).get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(null);});}catch(_){return null;}}
  async function idbSet(k,v){try{const db=await idbOpen();await new Promise((res)=>{const t=db.transaction(DIR_STORE,'readwrite').objectStore(DIR_STORE).put(v,k);t.oncomplete=res;t.onerror=res;});}catch(_){} }
  try{
    const saved = await idbGet(DIR_KEY);
    if(saved && typeof saved.queryPermission==='function'){
      const perm = await saved.queryPermission({mode:'readwrite'});
      if(perm==='granted'){ mountWorkspace(new FsaBackend(saved), 'folder · '+saved.name); }
    }
  }catch(_){}

  $('open-folder').onclick = async ()=>{
    if(!window.showDirectoryPicker){ pushSystem('This browser has no File System Access — folders unavailable.'); return; }
    try{
      const h = await window.showDirectoryPicker({ mode:'readwrite' });
      let perm = await h.queryPermission({mode:'readwrite'});
      if(perm!=='granted') perm = await h.requestPermission({mode:'readwrite'});
      if(perm!=='granted'){ pushSystem('Folder permission not granted.'); return; }
      mountWorkspace(new FsaBackend(h), 'folder · '+h.name);
      await idbSet(DIR_KEY, h);
      pushSystem('Workspace → folder "'+h.name+'". The agent now reads/writes your files.');
    }catch(e){ if(!(e&&e.name==='AbortError')) pushSystem('Open folder: '+(e&&e.message||e)); }
  };

  // ── State: projects → tasks. Persisted to localStorage (minus the live stack) ──
  const LS='anvil-state-v1';
  let state = load() || seedState();
  function seedState(){
    const pid=id(), t1=id(), t2=id();
    return {
      activeProject:pid, activeTask:t1, previewOpen:false,
      projects:[{ id:pid, name:'naklios', open:true, tasks:[
        { id:t1, title:'Wire the agent transport', status:'idle', mode:'code', convo:[], log:[], preview:null },
        { id:t2, title:'Preview pane demo', status:'done', mode:'code', convo:[], preview:{type:'html', file:'hello.html', content:'<!doctype html><body style="font-family:system-ui;display:grid;place-items:center;height:90vh;margin:0;background:#0E1012;color:#D98A28"><div style="text-align:center"><h1>◆</h1><p>Preview renders agent HTML output here.</p></div></body>'},
          log:[ {k:'user',text:'Show me what the preview pane looks like.'}, {k:'assistant',text:'The preview pane on the right renders showable output — a written HTML file, a diff, or command output. It opens on its own when a task produces something to look at, and collapses when there is nothing.'} ] },
      ]}],
    };
  }
  function id(){ return 'x'+Math.random().toString(36).slice(2,9); }
  function load(){ try{ return JSON.parse(localStorage.getItem(LS)); }catch(_){ return null; } }
  function save(){ try{ const c=JSON.parse(JSON.stringify(state)); localStorage.setItem(LS, JSON.stringify(c)); }catch(_){} }

  const proj = (pid)=> state.projects.find(p=>p.id===pid);
  const activeProject = ()=> proj(state.activeProject) || state.projects[0];
  function activeTask(){ for(const p of state.projects){ const t=(p.tasks||[]).find(t=>t.id===state.activeTask); if(t) return t; } return null; }

  // ── Left pane render ──
  function renderProjects(){
    const box=$('projects'); box.innerHTML='';
    for(const p of state.projects){
      const pd=document.createElement('div'); pd.className='proj';
      const prow=document.createElement('div'); prow.className='prow';
      prow.innerHTML=`<span class="tw">${p.open?'▾':'▸'}</span><span class="pname">${esc(p.name)}</span><span class="pcount">${(p.tasks||[]).length}</span>`;
      prow.onclick=()=>{ p.open=!p.open; save(); renderProjects(); };
      pd.appendChild(prow);
      if(p.open) for(const t of (p.tasks||[])){
        const td=document.createElement('div'); td.className='task'+(t.id===state.activeTask?' active':'');
        td.innerHTML=`<span class="dot ${t.status||'idle'}"></span><span class="ttitle">${esc(t.title)}</span>`;
        td.onclick=()=>selectTask(t.id);
        pd.appendChild(td);
      }
      box.appendChild(pd);
    }
  }
  function selectTask(tid){ state.activeTask=tid; for(const p of state.projects) if((p.tasks||[]).some(t=>t.id===tid)) state.activeProject=p.id; save(); renderAll(); }

  $('new-project').onclick=()=>{ const n=prompt('Project name:','project'); if(!n) return; const p={id:id(),name:n,open:true,tasks:[]}; state.projects.push(p); state.activeProject=p.id; save(); renderProjects(); };
  $('new-task').onclick=()=>{ const p=activeProject(); if(!p) return; const t={id:id(),title:'Untitled task',status:'idle',mode:'code',convo:[],log:[],preview:null}; p.tasks.push(t); p.open=true; selectTask(t.id); $('prompt').focus(); };

  // ── Center render ──
  function renderTaskbar(){
    const t=activeTask();
    $('tb-dot').className='dot '+((t&&t.status)||'idle');
    $('tb-title').textContent=t?t.title:'No task';
    $('tb-meta').textContent=t?(workspaceLabel):'';
  }
  function renderLog(){
    const box=$('log'); const t=activeTask();
    if(!t){ box.innerHTML='<div class="empty"><h2>No task selected</h2>Pick a task on the left, or make a new one.</div>'; return; }
    if(!t.log||!t.log.length){ box.innerHTML=`<div class="empty"><h2>${esc(t.title)}</h2>Describe what you want the agent to do. It works over the current workspace (<b>${esc(workspaceLabel)}</b>) with read / write / edit / shell tools.</div>`; return; }
    const w=document.createElement('div'); w.className='wrap';
    for(const e of t.log){
      if(e.k==='user'||e.k==='system'){
        const d=document.createElement('div'); d.className='msg '+e.k;
        d.innerHTML=`<div class="who">${e.k==='user'?'you':'system'}</div><div class="body"></div>`;
        d.querySelector('.body').textContent=e.text; w.appendChild(d);
      } else if(e.k==='assistant'){
        // Agent reply: render Markdown (code blocks get a Copy button), plus a
        // "Copy md" button on the whole reply.
        const d=document.createElement('div'); d.className='msg assistant';
        const head=document.createElement('div'); head.className='mhead';
        head.innerHTML='<div class="who">agent</div>';
        const cp=document.createElement('button'); cp.className='copybtn'; cp.textContent='Copy md';
        cp.title='Copy this reply as Markdown'; cp.onclick=()=>copyText(e.text, cp);
        head.appendChild(cp);
        const body=document.createElement('div'); body.className='body';
        renderMarkdown(body, e.text);
        d.appendChild(head); d.appendChild(body); w.appendChild(d);
      } else if(e.k==='tool'){
        const dt=document.createElement('details'); dt.className='tool'+(e.error?' err':''); if(e.open) dt.open=true;
        const sum=document.createElement('summary');
        sum.innerHTML=`<span class="tn">${esc(e.name)}</span><span class="td">${esc(e.detail||'')}</span><span class="tg">${e.error?'error':(e.result!=null?'result':'…')}</span>`;
        dt.appendChild(sum);
        const out = e.error!=null?e.error:e.result;
        if(out!=null){
          const o=document.createElement('div'); o.className='tout'; o.textContent=out; dt.appendChild(o);
          const cp=document.createElement('button'); cp.className='copybtn'; cp.textContent='Copy';
          cp.title='Copy output as Markdown';
          cp.onclick=(ev)=>{ ev.preventDefault(); ev.stopPropagation(); copyText('```\n'+out+'\n```', cp); };
          sum.appendChild(cp);
        }
        w.appendChild(dt);
      } else if(e.k==='change'){
        // "We made changes — view" (Claude Code / Codex style). The write/edit is
        // already applied (YOLO); clicking reads the current file and shows it in
        // the preview, instead of auto-popping the pane.
        const c=document.createElement('div'); c.className='change'; c.title='View this file in the preview';
        c.innerHTML=`<span class="ci">✎</span><span class="cf">${esc(e.verb||'wrote')} ${esc(e.file)}</span><span class="cv">view →</span>`;
        c.onclick=()=>openChange(e.file);
        w.appendChild(c);
      }
    }
    // Queued follow-ups (Codex-style): prompts waiting for the current run to end.
    for(let qi=0; qi<(t.queued||[]).length; qi++){
      const q=t.queued[qi], idx=qi;
      const d=document.createElement('div'); d.className='msg user queued';
      const head=document.createElement('div'); head.className='mhead';
      head.innerHTML='<div class="who">queued</div>';
      const x=document.createElement('button'); x.className='copybtn'; x.textContent='✕'; x.title='Remove from queue';
      x.onclick=()=>{ (t.queued||[]).splice(idx,1); save(); renderLog(); };
      head.appendChild(x);
      const body=document.createElement('div'); body.className='body'; body.textContent=q;
      d.appendChild(head); d.appendChild(body); w.appendChild(d);
    }
    box.innerHTML=''; box.appendChild(w); box.scrollTop=box.scrollHeight;
  }
  function renderPreview(){
    const t=activeTask(); const pv=t&&t.preview;
    $('main').classList.toggle('preview-open', !!state.previewOpen && !!pv);
    if(!pv){ $('pv-file').textContent=''; $('pv-body').innerHTML='<div class="pempty">Nothing to preview yet.<br>Agent output that can be shown appears here.</div>'; return; }
    $('pv-file').textContent=pv.file||'';
    const body=$('pv-body');
    if(pv.type==='html'){ body.innerHTML=''; const f=document.createElement('iframe'); f.setAttribute('sandbox','allow-scripts'); f.srcdoc=pv.content; body.appendChild(f); }
    else if(pv.type==='diff'){ body.innerHTML='<pre></pre>'; body.querySelector('pre').innerHTML=diffHtml(pv.content); }
    else { body.innerHTML='<pre></pre>'; body.querySelector('pre').textContent=pv.content; }
  }
  function renderAll(){ renderProjects(); renderTaskbar(); renderLog(); renderPreview(); }

  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function diffHtml(s){ return String(s).split('\n').map(l=>{ const c=l[0]; const cls=c==='+'?'add':c==='-'?'del':(c==='@'?'hd':''); return cls?`<span class="${cls}">${esc(l)}</span>`:esc(l); }).join('\n'); }

  function pushSystem(text){ const t=activeTask(); if(!t) return; (t.log=t.log||[]).push({k:'system',text}); save(); renderLog(); }

  // ── Change capture (view-on-click): the agent applies writes/edits directly
  // (YOLO); we don't auto-pop the preview. Instead we drop a compact "✎ wrote X ·
  // view" chip in the chat — click it to open the file/diff in the preview. ──
  function noteChange(t, name, args){
    try{
      const path = args && (args.path||args.file);
      if(!path || !(name==='write'||name==='edit')) return;
      t.log.push({ k:'change', file:path, verb: name==='edit'?'edited':'wrote' });
    }catch(_){}
  }
  // Clicking a change chip reads the CURRENT file from the workspace and shows it
  // in the preview (correct for both write and edit — no stale/partial content).
  async function openChange(file){
    const at=activeTask(); if(!at) return;
    let content='(could not read '+file+')';
    try{ const r=await fs.read(file,{encoding:'utf-8'}); if(r&&r.ok) content=r.data; }catch(_){}
    at.preview={ type:/\.html?$/.test(file)?'html':'text', file, content:String(content).slice(0,50000) };
    state.previewOpen=true; save(); renderPreview();
  }

  // ── Lightweight Markdown → DOM (fenced code blocks get a Copy button; inline
  // `code` and **bold**). Kept minimal on purpose — no external library. ──
  function renderMarkdown(container, text){
    container.innerHTML='';
    const parts = String(text==null?'':text).split('```');
    for(let i=0;i<parts.length;i++){
      if(i%2===1){
        let block=parts[i], lang='';
        const nl=block.indexOf('\n');
        if(nl>=0){ const first=block.slice(0,nl).trim(); if(/^[\w+.-]*$/.test(first)){ lang=first; block=block.slice(nl+1); } }
        container.appendChild(codeCard(lang, block.replace(/\n$/,'')));
      } else {
        const seg=parts[i]; if(!seg || !seg.replace(/\s/g,'')) continue;
        const p=document.createElement('div'); p.className='md-p';
        p.innerHTML = esc(seg.replace(/^\n+|\n+$/g,''))
          .replace(/`([^`]+)`/g, '<code class="inline">$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        container.appendChild(p);
      }
    }
    if(!container.childNodes.length){ const p=document.createElement('div'); p.className='md-p'; p.textContent=String(text||''); container.appendChild(p); }
  }
  function codeCard(lang, code){
    const wrap=document.createElement('div'); wrap.className='code';
    const head=document.createElement('div'); head.className='code-head';
    const l=document.createElement('span'); l.className='lang'; l.textContent=lang||'code';
    const btn=document.createElement('button'); btn.className='copybtn'; btn.textContent='Copy';
    btn.title='Copy code'; btn.onclick=()=>copyText(code, btn);
    head.appendChild(l); head.appendChild(btn);
    const pre=document.createElement('pre'); const c=document.createElement('code'); c.textContent=code; pre.appendChild(c);
    wrap.appendChild(head); wrap.appendChild(pre);
    return wrap;
  }
  function copyText(str, btn){
    const done=()=>{ if(!btn) return; const o=btn.textContent; btn.textContent='Copied'; btn.classList.add('ok'); setTimeout(()=>{ btn.textContent=o; btn.classList.remove('ok'); },1200); };
    try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(str).then(done, ()=>fallbackCopy(str,done)); return; } }catch(_){}
    fallbackCopy(str, done);
  }
  function fallbackCopy(str, done){
    try{ const ta=document.createElement('textarea'); ta.value=str; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done&&done(); }catch(_){}
  }

  // ── The model side — identical transport to Forge (host agent tier) ──
  async function inferViaHost({ messages, tools }){
    const ai = nak && nak.ai;
    if(!ai) throw new Error('Agent needs the NakliOS host — open Anvil inside NakliOS (naklios.dev), and set a model in Settings → AI.');
    let lastErr;
    for(let a=0;a<3;a++){
      try{
        const r = await ai.chat.completions.create({ agent:true, messages, tools, tool_choice:'auto', stream:false });
        const ch=r&&r.choices&&r.choices[0]; const m=(ch&&ch.message)||{};
        return { content: typeof m.content==='string'?m.content:'', toolCalls: Array.isArray(m.tool_calls)?m.tool_calls:[], finishReason:(ch&&ch.finish_reason)||'stop' };
      }catch(e){ lastErr=e; const s=String(e&&e.message||e); if((/\b(405|408|409|425|429|5\d\d)\b/.test(s)||/timeout|network|temporarily|fetch/i.test(s))&&a<2){ await new Promise(r=>setTimeout(r,400*(a+1))); continue; } throw e; }
    }
    throw lastErr;
  }

  const SYSTEM = 'You are a coding agent working over the user\'s files. Tools: read (line-numbered), write (whole file), edit (surgical old_string→new_string), apply_patch (add/update/delete files), todowrite (checklist), task (delegate to a subagent), shell (bash-style: ls, cat, grep, sed, git, pipes). Read a file before editing it. Prefer edit/apply_patch for changes, write for new files; use shell to explore and verify. Work in small, verifiable steps; end with a one-line summary.';
  const MODE_NOTE = { code:'', plan:' PLAN mode: read and think only — no writes/edits/shell; produce a concise plan.', ask:' ASK mode: read-only; answer the question, do not modify anything.' };

  let running=false;
  // Enter sends; while a run is in flight, Enter/Send QUEUES the prompt (Codex-
  // style) and it runs automatically when the current run finishes.
  function submit(){
    const t=activeTask(); if(!t) return;
    const text=$('prompt').value.trim(); if(!text) return;
    $('prompt').value=''; autoGrow();
    if(running){ (t.queued=t.queued||[]).push(text); save(); renderLog(); return; }
    runTask(t, text);
  }
  async function runTask(t, text){
    if(!t||running) return;
    if(t.title==='Untitled task'){ t.title=text.slice(0,48); }
    (t.log=t.log||[]).push({k:'user',text});
    const mode=t.mode||'code';
    t.status='running'; running=true; setSend(); save(); renderAll();

    const convo = (t.convo=t.convo||[]);
    convo.push({role:'user', content:text});
    let liveTool=null;
    try{
      const result = await runAgentLoop({
        messages:[{role:'system',content:SYSTEM+(MODE_NOTE[mode]||'')}, ...convo],
        tools: codingToolset(mode,{subagents:true}),
        infer: inferViaHost,
        executeTool: makeToolExecutor({ shell, face, mode, infer: inferViaHost }),
        maxSteps:24,
        onEvent:(e)=>{
          if(e.type==='tool-call'){ const a=e.args||{}; const detail=a.command||a.path||a.file||a.old_string||(a.patch?'patch':'')||''; liveTool={k:'tool',name:e.name,detail:String(detail).split('\n')[0].slice(0,120),result:null,error:null,args:a}; t.log.push(liveTool); renderLog(); }
          else if(e.type==='tool-result'){ if(liveTool){ liveTool.result=String(e.result==null?'':e.result).slice(0,8000); noteChange(t,liveTool.name,liveTool.args); liveTool=null; } renderLog(); }
          else if(e.type==='tool-error'){ if(liveTool){ liveTool.error=String(e.error); liveTool=null; } renderLog(); }
          else if(e.type==='assistant' && e.content){ t.log.push({k:'assistant',text:e.content}); renderLog(); }
          else if(e.type==='error'){ t.log.push({k:'system',text:'agent error: '+e.error}); renderLog(); }
        },
      });
      const finalAssistant=[...t.log].reverse().find(x=>x.k==='assistant');
      if(finalAssistant) convo.push({role:'assistant', content:finalAssistant.text});
      t.status = result.stop==='done'?'done':(result.stop==='error'?'error':'idle');
      t.log.push({k:'system',text:`agent ${result.stop} · ${result.steps} steps`});
    }catch(e){
      t.status='error';
      t.log.push({k:'system',text:String(e&&e.message||e)});
    }finally{
      running=false; setSend(); save(); renderAll();
      if(nak&&nak.title) nak.title('Anvil — '+t.title);
      // Drain the queue: run the next queued prompt for this task, if any.
      if(t.queued && t.queued.length){ const next=t.queued.shift(); save(); renderLog(); setTimeout(()=>runTask(t, next), 0); }
    }
  }
  // Never disabled — while running the button queues; label signals which.
  function setSend(){ $('send').textContent = running ? 'Queue' : 'Send'; }

  // ── Composer wiring ──
  const ta=$('prompt');
  function autoGrow(){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,180)+'px'; }
  ta.addEventListener('input', autoGrow);
  ta.addEventListener('keydown',(e)=>{
    // Enter sends (or queues); Shift+Enter inserts a newline. Guard IME composition.
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); submit(); }
  });
  $('send').onclick=submit;
  const MODES=['code','plan','ask'];
  $('mode-btn').onclick=()=>{ const t=activeTask(); if(!t) return; const i=MODES.indexOf(t.mode||'code'); t.mode=MODES[(i+1)%3]; $('mode-btn').textContent='mode: '+t.mode; $('mode-btn').classList.toggle('on',t.mode!=='code'); save(); };

  // ── Preview toggle ──
  $('toggle-preview').onclick=()=>{ state.previewOpen=!state.previewOpen; save(); renderPreview(); };
  $('pv-close').onclick=()=>{ state.previewOpen=false; save(); renderPreview(); };

  // ── boot ──
  function syncMode(){ const t=activeTask(); const m=(t&&t.mode)||'code'; $('mode-btn').textContent='mode: '+m; $('mode-btn').classList.toggle('on',m!=='code'); }
  renderAll(); syncMode();
  if(nak && nak.ready) nak.ready();
</script>
