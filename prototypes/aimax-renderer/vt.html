<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>naklios · aimax renderer — VT flavor</title>
<!-- xterm is already vendored in the repo (Forge uses it). This page must be served
     from the REPO ROOT so ../../vendor resolves:
       python3 -m http.server 8000        # run at repo root
       open http://localhost:8000/prototypes/aimax-renderer/vt.html -->
<link rel="stylesheet" href="../../vendor/xterm/5.5.0/xterm.css">
<style>
  :root{--bg:#0b0e12;--panel2:#0e1217;--line:#1c232c;--ink:#dfe6ee;--dim:#7f8b98;--accent:#5db0ff;--add:#5ad19a;--warn:#ffcf6b;
        --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:13px/1.5 var(--mono);display:flex;flex-direction:column;overflow:hidden}
  .bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel2);flex:0 0 auto}
  .bar .dot{width:9px;height:9px;border-radius:50%;background:#4a5560}
  .bar .dot.on{background:var(--add);box-shadow:0 0 8px var(--add)}
  .bar input{background:#0a0d11;border:1px solid var(--line);color:var(--ink);font:12px var(--mono);padding:5px 8px;border-radius:6px;width:220px}
  .bar button{background:#182029;border:1px solid var(--line);color:var(--ink);font:12px var(--mono);padding:5px 10px;border-radius:6px;cursor:pointer}
  .bar button:hover{border-color:var(--accent);color:#fff}
  .bar .sp{flex:1}
  .bar .who{color:var(--dim)} .bar .who b{color:var(--accent)}
  .bar a{color:var(--dim);text-decoration:none;font-size:12px} .bar a:hover{color:var(--accent)}
  #term{flex:1;min-height:0;padding:8px 10px}
  .foot{flex:0 0 auto;padding:6px 12px;border-top:1px solid var(--line);background:var(--panel2);color:#4a5560;font-size:11px}
</style>
</head>
<body>
  <div class="bar">
    <span class="dot" id="dot"></span>
    <input id="ws" value="ws://localhost:9123" spellcheck="false" aria-label="daemon websocket">
    <button id="connect">connect</button>
    <span class="sp"></span>
    <span class="who" id="who">the <b>raw-VT</b> flavor — any TUI daemon's byte stream, rendered by xterm</span>
    <a href="index.html">→ structured flavor</a>
  </div>
  <div id="term"></div>
  <div class="foot">keys are forwarded to the daemon as bytes · this is a thin remote-terminal client, no local shell</div>

<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// VT flavor — the "raw terminal in a tab" answer. If the aimax daemon emits an
// ANSI/VT byte stream (what a plain TUI does), we need no protocol at all: pipe
// bytes → xterm, and forward keystrokes → daemon. Reusable for ANY remote TUI.
// The tradeoff vs the structured flavor (index.html): no semantic hooks — you
// get a character grid, not native panels / an agent strip you can style.
// ─────────────────────────────────────────────────────────────────────────────
import { Terminal } from '../../vendor/xterm/5.5.0/xterm.mjs';
import { FitAddon } from '../../vendor/xterm/5.5.0/addon-fit.mjs';

const $ = (id) => document.getElementById(id);
const term = new Terminal({
  fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
  fontSize: 13, cursorBlink: true, convertEol: false,
  theme: { background: '#0b0e12', foreground: '#dfe6ee', cursor: '#5db0ff' },
});
const fit = new FitAddon();
term.loadAddon(fit);
term.open($('term'));
fit.fit();
addEventListener('resize', () => { try { fit.fit(); sendResize(); } catch (_) {} });
term.writeln('\x1b[90m(not connected — Connect to a daemon that speaks raw VT)\x1b[39m');

let socket = null;
function sendResize() {
  if (socket && socket.readyState === 1)
    socket.send(JSON.stringify({ t: 'resize', cols: term.cols, rows: term.rows }));
}
$('connect').onclick = () => {
  const url = $('ws').value.trim();
  try {
    if (socket) socket.close();
    socket = new WebSocket(url);
    socket.binaryType = 'arraybuffer';
    $('who').textContent = 'connecting…'; $('dot').className = 'dot';
    socket.onopen = () => {
      $('dot').className = 'dot on';
      $('who').innerHTML = 'connected — <b>raw VT</b> stream';
      socket.send(JSON.stringify({ t: 'hello', client: 'naklios-vt', mode: 'vt', proto: 1 }));
      sendResize();
      term.reset();
    };
    socket.onmessage = (ev) => {
      const data = typeof ev.data === 'string' ? ev.data : new TextDecoder().decode(ev.data);
      term.write(data); // bytes straight to the emulator
    };
    socket.onclose = () => { $('dot').className = 'dot'; $('who').textContent = 'disconnected'; };
    socket.onerror = () => { $('who').innerHTML = '<span style="color:var(--warn)">connect failed — daemon on ' + url + '? (https can\'t reach ws://localhost — serve from localhost)</span>'; };
  } catch (_) { $('who').textContent = 'bad url'; }
};

// keystrokes → daemon as bytes (xterm gives us the VT-encoded input)
term.onData((d) => { if (socket && socket.readyState === 1) socket.send(JSON.stringify({ t: 'input', bytes: d })); });
</script>
</body>
</html>
