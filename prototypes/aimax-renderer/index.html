<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>naklios · aimax renderer (sketch)</title>
<style>
  :root{
    --bg:#0b0e12; --panel:#11151b; --panel2:#0e1217; --line:#1c232c;
    --ink:#dfe6ee; --dim:#7f8b98; --faint:#4a5560; --accent:#5db0ff;
    --agent:#c9a0ff; --add:#5ad19a; --cursor:#5db0ff; --warn:#ffcf6b;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--mono);
       display:flex;flex-direction:column;overflow:hidden}

  /* ── top bar: transport ── */
  .bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);
       background:var(--panel2);flex:0 0 auto}
  .bar .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:0 0 auto}
  .bar .dot.on{background:var(--add);box-shadow:0 0 8px var(--add)}
  .bar .dot.demo{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .bar input{background:#0a0d11;border:1px solid var(--line);color:var(--ink);
             font:12px var(--mono);padding:5px 8px;border-radius:6px;width:230px}
  .bar button{background:#182029;border:1px solid var(--line);color:var(--ink);
              font:12px var(--mono);padding:5px 10px;border-radius:6px;cursor:pointer}
  .bar button:hover{border-color:var(--accent);color:#fff}
  .bar .sp{flex:1}
  .bar .who{color:var(--dim)}
  .bar .who b{color:var(--accent);font-weight:600}

  /* ── window grid ── */
  .stage{flex:1;display:flex;min-height:0;padding:10px;gap:10px}
  .win{background:var(--panel);border:1px solid var(--line);border-radius:9px;
       display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .win.focus{border-color:#2b3947;box-shadow:0 0 0 1px #22303c inset,0 8px 30px rgba(0,0,0,.35)}
  .win .head{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--line);
             background:var(--panel2);flex:0 0 auto}
  .win .head .name{color:var(--ink);font-weight:600}
  .win .head .mode{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .win .head .ver{margin-left:auto;color:var(--faint);font-size:11px}
  .win.focus .head .name{color:#fff}
  .buf{flex:1;overflow:auto;padding:8px 0}
  .row{display:flex;white-space:pre;padding:0 12px}
  .row .ln{color:var(--faint);width:3.2em;text-align:right;margin-right:14px;
           user-select:none;flex:0 0 auto}
  .row .tx{flex:1;min-width:0}
  .row.cur .ln{color:var(--accent)}
  .caret{display:inline-block;width:.55em;margin:0 -.55em 0 0;border-left:2px solid var(--cursor);
         animation:blink 1.1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .tok-kw{color:#7db4ff} .tok-str{color:#8fd7a6} .tok-fn{color:#c9a0ff} .tok-cm{color:var(--faint)}

  /* ── agent strip ── */
  .agent{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel2);
         padding:8px 11px;color:var(--dim);font-size:12px;display:flex;gap:8px;align-items:flex-start}
  .agent .tag{color:var(--agent);font-weight:600;flex:0 0 auto}
  .agent .txt{white-space:pre-wrap;color:#b9c4d0}
  .agent .txt .care{border-left:2px solid var(--agent);margin-left:1px;animation:blink 1.1s step-end infinite}
  .win .agent{display:none}
  .win.hasagent .agent{display:flex}

  /* ── minibuffer / echo ── */
  .mini{flex:0 0 auto;display:flex;gap:0;border-top:1px solid var(--line);
        background:#0a0d11;padding:7px 12px;color:var(--ink);min-height:34px;align-items:center}
  .mini .prompt{color:var(--accent);margin-right:6px;white-space:pre}
  .mini .echo{color:var(--dim)}
  .mini .care{border-left:2px solid var(--ink);animation:blink 1.1s step-end infinite}

  /* ── outbound log (what the frontend sends the daemon) ── */
  .wire{position:fixed;right:10px;bottom:44px;width:300px;max-height:40vh;overflow:auto;
        background:rgba(10,13,17,.94);border:1px solid var(--line);border-radius:8px;
        padding:8px 10px;font-size:11px;color:var(--dim);display:none}
  .wire.show{display:block}
  .wire h4{margin:0 0 6px;color:var(--faint);font-weight:600;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .wire .m{color:#89b7e6;white-space:pre-wrap;word-break:break-all;margin-bottom:2px}
  .hint{position:fixed;left:12px;bottom:10px;color:var(--faint);font-size:11px}
  #recBtn.on{border-color:#ff6b6b;color:#ff8f8f}

  /* ── command palette (Cmd-K) ── */
  .pal{position:fixed;inset:0;background:rgba(4,6,9,.5);display:none;align-items:flex-start;justify-content:center;z-index:20}
  .pal.show{display:flex}
  .pal .box{margin-top:12vh;width:min(560px,92vw);background:var(--panel);border:1px solid #2b3947;
            border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}
  .pal input{width:100%;background:#0a0d11;border:0;border-bottom:1px solid var(--line);color:var(--ink);
             font:14px var(--mono);padding:12px 14px;outline:none}
  .pal .list{max-height:44vh;overflow:auto}
  .pal .it{padding:9px 14px;cursor:pointer;color:var(--dim);display:flex;gap:10px;align-items:center}
  .pal .it .k{color:var(--accent);flex:0 0 auto}
  .pal .it.sel,.pal .it:hover{background:#17202a;color:var(--ink)}
  .pal .hintbar{padding:7px 14px;color:var(--faint);font-size:11px;border-top:1px solid var(--line);background:var(--panel2)}
</style>
</head>
<body>
  <div class="bar">
    <span class="dot" id="dot"></span>
    <input id="ws" value="ws://localhost:9123" spellcheck="false" aria-label="daemon websocket">
    <button id="connect">connect</button>
    <button id="demo">▶ demo daemon</button>
    <span class="sp"></span>
    <span class="who" id="who">no daemon — this is the <b>renderer</b> half only</span>
    <button id="recBtn" title="record the inbound message stream to a .jsonl">⏺ rec</button>
    <button id="replayBtn" title="replay a recorded .jsonl session">replay</button>
    <input type="file" id="replayFile" accept=".jsonl,.json,application/json" hidden>
    <a href="vt.html" style="color:var(--dim);text-decoration:none;font-size:12px" title="the raw-VT flavor">VT →</a>
    <button id="wireBtn">wire ▾</button>
  </div>

  <div class="stage" id="stage"></div>

  <div class="mini" id="mini"><span class="prompt" id="miniPrompt"></span><span class="echo" id="miniEcho"></span></div>

  <div class="pal" id="pal">
    <div class="box">
      <input id="palInput" placeholder="M-x  — a command name to send the daemon…" spellcheck="false">
      <div class="list" id="palList"></div>
      <div class="hintbar">↑↓ select · ↵ send to daemon · esc close — the daemon owns what each command does</div>
    </div>
  </div>

  <div class="wire" id="wireBox"><h4>→ frontend sends daemon</h4><div id="wireList"></div></div>
  <div class="hint" id="hint">keys type into the focused window · they are sent to the daemon, never executed here</div>

<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// naklios · aimax renderer — SKETCH
//
// This is the *frontend* half only. It holds NO editing logic: it renders
// whatever a daemon streams over the socket, and sends keystrokes / commands
// back. The daemon (svs's aimax core) is the source of truth for every buffer.
//
// The wire format it speaks is the STRUCTURED flavor documented in PROTOCOL.md
// — semantic messages (buffers, windows, cursor, agent) rather than raw VT.
// That's what lets this draw a native UI instead of a character grid.
// ─────────────────────────────────────────────────────────────────────────────

const $ = (id) => document.getElementById(id);
const stage = $('stage'), miniPrompt = $('miniPrompt'), miniEcho = $('miniEcho');

// ── renderer state: a mirror of the daemon, nothing more ──
const state = { buffers: new Map(), windows: [], focus: null, agents: new Map() };

function render(){
  // windows
  stage.innerHTML = '';
  const wins = state.windows.length ? state.windows
    : [...state.buffers.keys()].slice(0,1).map(b => ({ id:'w0', buffer:b, weight:1 }));
  for(const w of wins){
    const buf = state.buffers.get(w.buffer);
    const el = document.createElement('div');
    el.className = 'win' + (w.id===state.focus ? ' focus':'');
    el.style.flex = String(w.weight || 1);
    el.dataset.win = w.id;
    const ag = [...state.agents.values()].find(a => a.buffer === w.buffer && a.state!=='idle');
    if(ag) el.classList.add('hasagent');
    el.innerHTML = `
      <div class="head">
        <span class="name">${esc(buf?.name || w.buffer)}</span>
        <span class="mode">${esc(buf?.mode || '')}</span>
        <span class="ver">${buf ? 'v'+(buf.version||0) : '—'}</span>
      </div>
      <div class="buf">${buf ? renderBuf(buf) : '<div class="row"><span class="tx" style="color:var(--faint);padding:8px">waiting for buffer…</span></div>'}</div>
      <div class="agent"><span class="tag">agent</span><span class="txt">${ag ? esc(ag.text||'')+(ag.state==='streaming'?'<span class="care"> </span>':'') : ''}</span></div>`;
    stage.appendChild(el);
  }
}

function renderBuf(buf){
  const cur = buf.cursor || {line:-1,col:0};
  return (buf.lines||[]).map((ln,i)=>{
    const isCur = i===cur.line;
    let tx = highlight(ln, buf.mode);
    if(isCur){
      const c = Math.min(cur.col, ln.length);
      tx = highlight(ln.slice(0,c), buf.mode) + '<span class="caret"> </span>' + highlight(ln.slice(c), buf.mode);
    }
    return `<div class="row${isCur?' cur':''}"><span class="ln">${i+1}</span><span class="tx">${tx || ' '}</span></div>`;
  }).join('');
}

// toy highlighter — the daemon could instead send tree-sitter spans; this is just so the sketch looks alive
function highlight(s, mode){
  let h = esc(s);
  if(!mode) return h;
  h = h.replace(/\b(fn|let|mut|use|pub|struct|impl|match|for|if|else|return|async|await|def|class|import|from|const)\b/g,'<span class="tok-kw">$1</span>');
  h = h.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g,'<span class="tok-str">$1</span>');
  h = h.replace(/(\/\/.*$|#.*$)/g,'<span class="tok-cm">$1</span>');
  return h;
}
const esc = (s)=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

// ── inbound: apply one daemon message ──
function apply(m){
  if(recording) recBuf.push({ dt: Date.now()-recT0, m });
  switch(m.t){
    case 'hello':   setWho(`<b>${esc(m.app||'daemon')}</b> · proto ${m.proto} · caps: ${(m.caps||[]).join(', ')}`); break;
    case 'windows': state.windows = m.layout || []; state.focus = m.focus ?? state.focus; break;
    case 'buffer':  state.buffers.set(m.id, { name:m.name, mode:m.mode, lines:m.lines||[], cursor:m.cursor, version:m.version||0 }); break;
    case 'cursor':  { const b=state.buffers.get(m.id); if(b){ b.cursor=m.cursor; if(m.version!=null)b.version=m.version; } break; }
    case 'patch': { const b=state.buffers.get(m.id);
                    if(b && m.from!=null && b.version!==m.from){ requestResync(m.id); break; } // a message was missed → resync
                    applyPatch(m); break; }
    case 'agent':   { const a = state.agents.get(m.id)||{buffer:m.buffer,text:'',state:'idle'};
                      a.buffer=m.buffer??a.buffer; a.state=m.state??a.state;
                      if(m.chunk) a.text=(a.text||'')+m.chunk; if(m.text!=null)a.text=m.text;
                      state.agents.set(m.id,a); break; }
    case 'minibuffer': miniPrompt.textContent=m.prompt||''; miniEcho.innerHTML=esc(m.text||'')+'<span class="care"> </span>'; return render();
    case 'echo':    miniPrompt.textContent=''; miniEcho.textContent=m.text||''; return render();
  }
  render();
}
function applyPatch(m){
  const b = state.buffers.get(m.id); if(!b) return;
  for(const e of (m.edits||[])){
    const [[l0,c0],[l1,c1]] = e.range;
    if(l0===l1){ const ln=b.lines[l0]??''; b.lines[l0]=ln.slice(0,c0)+e.text+ln.slice(c1); }
  }
  if(m.version!=null) b.version=m.version;
}

// ── outbound: what the frontend sends the daemon ──
let sink = null; // function(obj) — set by demo or ws
function send(obj){
  logWire(obj);
  if(sink) sink(obj);
}
function logWire(obj){
  const list = $('wireList');
  const d = document.createElement('div'); d.className='m'; d.textContent = JSON.stringify(obj);
  list.prepend(d); while(list.children.length>40) list.lastChild.remove();
}

// keystrokes → daemon (never executed locally)
window.addEventListener('keydown',(e)=>{
  if((e.metaKey||e.ctrlKey) && e.key==='k'){ e.preventDefault(); openPalette(); return; } // Cmd/Ctrl-K palette
  if(e.target.tagName==='INPUT') return; // typing in the ws box or palette
  const mods=[]; if(e.ctrlKey)mods.push('C'); if(e.altKey)mods.push('M'); if(e.metaKey)mods.push('S');
  const printable = e.key.length===1;
  if(printable || ['Enter','Backspace','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Escape'].includes(e.key)){
    e.preventDefault();
    send({t:'key', window:state.focus, key:e.key, mods});
  }
});

// click a window to focus it → tell the daemon
stage.addEventListener('click',(e)=>{
  const win = e.target.closest('.win'); if(!win) return;
  const id = win.dataset.win; if(!id || id===state.focus) return;
  state.focus = id; render(); send({t:'focus', window:id});
});

// a gap in buffer versions → ask the daemon to resend the whole buffer
function requestResync(id){ send({t:'resync', id}); apply({t:'echo',text:`version gap on ${id} — requested resync`}); }

function resetState(){ state.buffers.clear(); state.windows=[]; state.focus=null; state.agents.clear(); }

// ── record / replay ──────────────────────────────────────────────────────────
let recording=false, recBuf=[], recT0=0;
$('recBtn').onclick=()=>{
  if(!recording){ recording=true; recBuf=[]; recT0=Date.now(); $('recBtn').classList.add('on'); $('recBtn').textContent='⏹ save'; }
  else{ recording=false; $('recBtn').classList.remove('on'); $('recBtn').textContent='⏺ rec';
        const jsonl=recBuf.map(r=>JSON.stringify(r)).join('\n');
        const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([jsonl],{type:'application/x-ndjson'}));
        a.download='aimax-session.jsonl'; a.click(); URL.revokeObjectURL(a.href);
        apply({t:'echo',text:`saved ${recBuf.length} messages → aimax-session.jsonl`}); }
};
$('replayBtn').onclick=()=>$('replayFile').click();
$('replayFile').onchange=(e)=>{ const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader(); rd.onload=()=>playRecording(String(rd.result)); rd.readAsText(f); e.target.value=''; };
function playRecording(text){
  if(socket)socket.close(); sink=null; setDot('demo');
  const rows=text.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(_){return null}}).filter(Boolean);
  if(!rows.length){ setWho('empty recording'); return; }
  setWho(`<b>replaying</b> · ${rows.length} messages`); resetState(); render();
  for(const r of rows){ const dt=Math.max(0, r.dt||0); const m=r.m||r; setTimeout(()=>apply(m), dt); }
}

// ── command palette (Cmd-K) — proposes M-x commands; the daemon owns their meaning ──
const PAL_CMDS=['save-buffer','revert-buffer','split-window-right','split-window-below','other-window',
                'find-file','kill-buffer','agent-run','agent-stop','goto-line','query-replace'];
let palSel=0, palShown=[];
function openPalette(){ $('pal').classList.add('show'); const inp=$('palInput'); inp.value=''; renderPal(''); inp.focus(); }
function closePalette(){ $('pal').classList.remove('show'); }
function renderPal(q){
  palShown = PAL_CMDS.filter(c=>c.includes(q.toLowerCase().trim()));
  palSel=0;
  $('palList').innerHTML = palShown.map((c,i)=>`<div class="it${i===0?' sel':''}" data-i="${i}"><span class="k">M-x</span>${esc(c)}</div>`).join('')
                          || '<div class="it" style="color:var(--faint)">no match — ↵ sends what you typed</div>';
}
$('palInput').addEventListener('input',(e)=>renderPal(e.target.value));
$('palInput').addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){ e.preventDefault(); closePalette(); return; }
  if(e.key==='ArrowDown'){ e.preventDefault(); palSel=Math.min(palSel+1,Math.max(palShown.length-1,0)); markPal(); return; }
  if(e.key==='ArrowUp'){ e.preventDefault(); palSel=Math.max(palSel-1,0); markPal(); return; }
  if(e.key==='Enter'){ e.preventDefault(); const name=palShown[palSel] || $('palInput').value.trim(); if(name){ send({t:'command',name}); apply({t:'minibuffer',prompt:'M-x ',text:name}); } closePalette(); }
});
function markPal(){ [...$('palList').children].forEach((el,i)=>el.classList.toggle('sel',i===palSel)); }
$('palList').addEventListener('click',(e)=>{ const it=e.target.closest('.it'); if(!it||it.dataset.i==null)return;
  const name=palShown[Number(it.dataset.i)]; if(name){ send({t:'command',name}); apply({t:'minibuffer',prompt:'M-x ',text:name}); } closePalette(); });
$('pal').addEventListener('click',(e)=>{ if(e.target.id==='pal') closePalette(); });

function setWho(html){ $('who').innerHTML = html; }
function setDot(cls){ $('dot').className = 'dot '+(cls||''); const h=$('hint'); if(h) h.style.display = cls ? 'none' : ''; }

// ── transport A: real WebSocket to a live daemon ──
let socket=null;
$('connect').onclick = ()=>{
  const url = $('ws').value.trim();
  try{
    if(socket) socket.close();
    socket = new WebSocket(url);
    setWho('connecting…'); setDot('');
    socket.onopen = ()=>{ setDot('on'); sink=(o)=>socket.send(JSON.stringify(o)); send({t:'hello',client:'naklios-render',proto:1}); };
    socket.onmessage = (ev)=>{ try{ apply(JSON.parse(ev.data)); }catch(_){ } };
    socket.onclose = ()=>{ setDot(''); setWho('disconnected'); sink=null; };
    socket.onerror = ()=>{ setWho('<span style="color:var(--warn)">connect failed — is the daemon on '+esc(url)+'? (a page on https can\'t reach ws://localhost — serve this from localhost, see README)</span>'); };
  }catch(err){ setWho('bad url'); }
};

// ── transport B: an embedded MOCK daemon, so the sketch renders with no server ──
$('demo').onclick = ()=>{ if(socket)socket.close(); startDemo(); };
function startDemo(){
  setDot('demo'); setWho('<b>mock daemon</b> · embedded · proto 1 · caps: buffers, windows, agent, minibuffer');
  sink = (o)=>{ /* a real daemon would act on keys; the mock just echoes intent */
    if(o.t==='key' && o.key && o.key.length===1) mockType(o.key);
    if(o.t==='key' && o.key==='Enter') apply({t:'echo',text:'↩ sent to daemon'});
    if(o.t==='command') apply({t:'minibuffer',prompt:'M-x ',text:o.name||''});
  };
  // seed windows + buffers
  apply({t:'hello',app:'aimax',proto:1,caps:['buffers','windows','agent','minibuffer']});
  apply({t:'buffer',id:'b1',name:'main.rs',mode:'rust',version:3,cursor:{line:5,col:0},
    lines:['use crate::agent::Agent;','','fn main() {','    let mut ed = Editor::new();','    // agent is a first-class citizen','    ed.attach(Agent::claude());','    ed.run();','}']});
  apply({t:'buffer',id:'b2',name:'*agent*',mode:'',version:1,cursor:{line:-1,col:0},
    lines:['◆ watching buffer main.rs','◆ awaiting instruction']});
  apply({t:'windows',focus:'w1',layout:[{id:'w1',buffer:'b1',weight:1.6},{id:'w2',buffer:'b2',weight:1}]});
  apply({t:'minibuffer',prompt:'',text:''});
  apply({t:'echo',text:'aimax daemon ready · 2 buffers · 1 agent'});
  // an agent streams a suggestion into the *agent* buffer, then patches main.rs
  const script = 'I can wire the run-loop to stream agent output into a side buffer. Applying edit to main.rs line 6…';
  let i=0, a='a1';
  apply({t:'agent',id:a,buffer:'b2',state:'streaming',text:''});
  const iv = setInterval(()=>{
    if(i>=script.length){
      clearInterval(iv);
      apply({t:'agent',id:a,buffer:'b2',state:'idle',text:script});
      apply({t:'patch',id:'b1',from:3,version:4,edits:[{range:[[5,4],[5,4]],text:'/* by agent */ '}]});
      apply({t:'cursor',id:'b1',cursor:{line:5,col:19},version:4});
      apply({t:'echo',text:'agent edited main.rs · +1 change'});
      return;
    }
    apply({t:'agent',id:a,buffer:'b2',state:'streaming',chunk:script[i++]});
  },28);
}
function mockType(ch){
  const b=state.buffers.get('b1'); if(!b||!b.cursor)return;
  const {line,col}=b.cursor; const ln=b.lines[line]??'';
  b.lines[line]=ln.slice(0,col)+ch+ln.slice(col); b.cursor={line,col:col+1}; b.version++;
  render();
}

// wire panel
$('wireBtn').onclick=()=>$('wireBox').classList.toggle('show');

// first paint
render();
setDot('');

// ?replay=<url-to-jsonl> — load a recorded session by link (shareable, headless-friendly)
const _rp = new URLSearchParams(location.search).get('replay');
if(_rp){ fetch(_rp).then(r=>r.text()).then(playRecording).catch(()=>setWho('replay fetch failed')); }
// ?demo=1 — auto-start the embedded mock
if(new URLSearchParams(location.search).get('demo')) startDemo();
</script>
</body>
</html>
