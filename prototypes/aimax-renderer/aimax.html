<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>naklios · aimax (real IPC)</title>
<style>
  :root{
    --bg:#0b0e12;--panel:#11151b;--panel2:#0e1217;--line:#1c232c;--ink:#dfe6ee;--dim:#7f8b98;
    --faint:#4a5560;--accent:#5db0ff;--agent:#c9a0ff;--add:#5ad19a;--warn:#ffcf6b;--cursor:#5db0ff;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 var(--mono);display:flex;flex-direction:column;overflow:hidden}
  .bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel2);flex:0 0 auto}
  .bar .dot{width:9px;height:9px;border-radius:50%;background:var(--faint)}
  .bar .dot.on{background:var(--add);box-shadow:0 0 8px var(--add)}
  .bar input{background:#0a0d11;border:1px solid var(--line);color:var(--ink);font:12px var(--mono);padding:5px 8px;border-radius:6px;width:190px}
  .bar button{background:#182029;border:1px solid var(--line);color:var(--ink);font:12px var(--mono);padding:5px 10px;border-radius:6px;cursor:pointer}
  .bar button:hover{border-color:var(--accent);color:#fff}
  .bar button:focus-visible,.bar a:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  .bar .sp{flex:1}
  .bar .who{color:var(--dim)} .bar .who b{color:var(--accent)}
  .bar a{color:var(--dim);text-decoration:none;font-size:12px} .bar a:hover{color:var(--accent)}

  .tabs{display:flex;gap:2px;padding:6px 10px 0;background:var(--panel2);border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto}
  .tab{padding:6px 12px;border:1px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0;color:var(--dim);
       background:var(--panel2);cursor:pointer;white-space:nowrap;font-size:12px}
  .tab .m{color:var(--warn)}
  .tab.cur{background:var(--panel);color:#fff;border-color:#2b3947}
  .tab:hover{color:var(--ink)}

  .buf{flex:1;overflow:auto;background:var(--panel);padding:8px 0}
  .buf:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  /* not-connected placeholder (UX3) */
  .ph{max-width:46rem;margin:7vh auto 0;padding:0 22px;color:var(--dim);line-height:1.65}
  .ph h2{color:var(--ink);font-weight:600;font-size:1.05rem;margin:0 0 .5rem}
  .ph ol{margin:.5rem 0;padding-left:1.4rem}
  .ph li{margin:.55rem 0}
  .ph code{font-size:.86em;background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:.12em .45em;border-radius:5px;word-break:break-all}
  .ph a{color:var(--accent);text-decoration:none}
  .ph a:hover{text-decoration:underline}
  .row{display:flex;white-space:pre;padding:0 12px}
  .row .ln{color:var(--faint);width:3.4em;text-align:right;margin-right:14px;user-select:none;flex:0 0 auto}
  .row .tx{flex:1;min-width:0}
  .row.cur .ln{color:var(--accent)}
  .caret{display:inline-block;width:0;border-left:2px solid var(--cursor);margin:0 -1px;animation:blink 1.1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .tok-kw{color:#7db4ff}.tok-str{color:#8fd7a6}.tok-cm{color:var(--faint)}

  .status{flex:0 0 auto;display:flex;gap:14px;padding:6px 12px;border-top:1px solid var(--line);background:var(--panel2);color:var(--dim);font-size:12px}
  .status .k{color:var(--faint)} .status b{color:var(--ink);font-weight:600}

  .wire{position:fixed;right:10px;bottom:40px;width:340px;max-height:44vh;overflow:auto;background:rgba(10,13,17,.95);
        border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;display:none}
  .wire.show{display:block}
  .wire h4{margin:0 0 6px;color:var(--faint);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .wire .o{color:#89b7e6;white-space:pre-wrap;word-break:break-all}
  .wire .i{color:#8fd7a6;white-space:pre-wrap;word-break:break-all}
  .wire .e{color:var(--agent)}

  .pal{position:fixed;inset:0;background:rgba(4,6,9,.5);display:none;align-items:flex-start;justify-content:center;z-index:20}
  .pal.show{display:flex}
  .pal .box{margin-top:12vh;width:min(620px,92vw);background:var(--panel);border:1px solid #2b3947;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}
  .pal input{width:100%;background:#0a0d11;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:14px var(--mono);padding:12px 14px;outline:none}
  .pal .list{max-height:40vh;overflow:auto}
  .pal .it{padding:8px 14px;cursor:pointer;color:var(--dim)}
  .pal .it .k{color:var(--agent)}
  .pal .it.sel,.pal .it:hover{background:#17202a;color:var(--ink)}
  .pal .hintbar{padding:7px 14px;color:var(--faint);font-size:11px;border-top:1px solid var(--line);background:var(--panel2)}
  .hint{position:fixed;left:12px;bottom:9px;color:var(--dim);font-size:11px}
</style>
</head>
<body>
  <div class="bar">
    <span class="dot" id="dot"></span>
    <input id="ws" value="ws://localhost:9130" spellcheck="false" aria-label="bridge websocket">
    <button id="connect">connect</button>
    <span class="sp"></span>
    <span class="who" id="who">not connected — start aimax <b>--headless</b> + the bridge, then Connect</span>
    <button id="evalBtn" title="run Scheme (Cmd-K)">M-x</button>
    <a href="guide.html" title="how to set this up">first time? setup guide ↗</a>
    <button id="wireBtn">wire ▾</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="buf" id="buf" tabindex="0"></div>
  <div class="status" id="status"></div>

  <div class="pal" id="pal">
    <div class="box">
      <input id="palInput" placeholder="Scheme to eval — e.g. (buffer-insert &quot;hi&quot;) · (buffer-switch &quot;*scratch*&quot;)" spellcheck="false">
      <div class="list" id="palList"></div>
      <div class="hintbar">↑↓ select · ↵ eval on the daemon · esc close — this is aimax's real `eval` method</div>
    </div>
  </div>

  <div class="wire" id="wireBox"><h4>JSON-RPC over the bridge</h4><div id="wireList"></div></div>
  <div class="hint" id="hint">click the buffer &amp; type — edits go to the daemon as (buffer-insert …); nothing is edited locally</div>

<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// naklios · aimax real client — speaks aimax's OWN protocol:
//   JSON-RPC 2.0 over its unix socket, reached via bridge.mjs (unix ↔ ws).
//   subscribe → events; get_state (buffer list + cursor); eval (buffer-text) for
//   content; pull-on-notify. Edits/commands are eval of Scheme. No invented wire.
// ─────────────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s)=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let socket=null, nextId=1;
const pending=new Map();                 // id → {resolve,reject}
const state={ buffers:[], current:null, cwd:'', text:'', line:1, column:0, modified:false, chat:false };

// ── JSON-RPC plumbing ──
function rpc(method, params){
  return new Promise((resolve,reject)=>{
    if(!socket||socket.readyState!==1) return reject(new Error('not connected'));
    const id=nextId++; pending.set(id,{resolve,reject});
    const msg={jsonrpc:'2.0',method,params,id};
    logWire('o', method+' '+(params?JSON.stringify(params):''));
    socket.send(JSON.stringify(msg)+'\n');   // aimax reads newline-delimited requests
    setTimeout(()=>{ if(pending.has(id)){ pending.delete(id); reject(new Error('timeout')); } }, 8000);
  });
}
function onLine(line){
  let o; try{ o=JSON.parse(line); }catch(_){ return; }
  if(o.id!=null && (('result' in o)||('error' in o))){        // response
    const p=pending.get(o.id); if(!p) return; pending.delete(o.id);
    logWire('i', 'id='+o.id+' '+JSON.stringify(o.result??o.error).slice(0,160));
    o.error ? p.reject(new Error(o.error.message)) : p.resolve(o.result);
  } else if(o.method==='event'){                               // notification
    const t=o.params?.type; logWire('e','event '+t+(o.params?.buffer?(' '+o.params.buffer):''));
    scheduleRefresh();
  }
}
async function evalScheme(code){ return rpc('eval',{code}); }

// (buffer-text) comes back as Steel's displayed string ("..\n.."); escaping is
// JSON-compatible, so JSON.parse recovers the raw text (fallback: strip+unescape).
function unwrap(result){
  if(typeof result!=='string') return String(result??'');
  if(result.startsWith('"')&&result.endsWith('"')){
    try{ return JSON.parse(result); }
    catch(_){ return result.slice(1,-1).replace(/\\n/g,'\n').replace(/\\"/g,'"').replace(/\\\\/g,'\\'); }
  }
  return result;
}

// ── pull-on-notify: refresh the mirror from the daemon ──
let refreshTimer=null;
function scheduleRefresh(){ clearTimeout(refreshTimer); refreshTimer=setTimeout(refresh,40); }
async function refresh(){
  try{
    const st=await rpc('get_state',{});
    state.buffers=st.buffers||[]; state.current=st.current_buffer; state.cwd=st.cwd||'';
    state.chat=!!st.chat_streaming;
    const cur=state.buffers.find(b=>b.current)||state.buffers.find(b=>b.name===state.current);
    state.line=cur?cur.line:1; state.column=cur?cur.column:0; state.modified=cur?cur.modified:false;
    state.text=unwrap(await evalScheme('(buffer-text)'));
    render();
  }catch(e){ setWho('<span style="color:var(--warn)">'+esc(e.message)+'</span>'); }
}

// ── render ──
function render(){
  // tabs
  $('tabs').innerHTML = state.buffers.map(b=>
    `<div class="tab${b.current?' cur':''}" data-name="${esc(b.name)}">${esc(b.name)}${b.modified?' <span class="m">●</span>':''}</div>`).join('');
  // buffer content — or the not-connected placeholder (UX3)
  const hintEl=$('hint'); if(hintEl) hintEl.style.display = state.buffers.length ? '' : 'none';
  if(!state.buffers.length){
    $('buf').innerHTML = `<div class="ph">
      <h2>Not connected</h2>
      <ol>
        <li>Run your daemon: <code>aimax --headless</code></li>
        <li>Fetch &amp; run the bridge: <code>curl -fsSL https://bridge.naklios.dev -o nakli-bridge.mjs &amp;&amp; node nakli-bridge.mjs</code></li>
        <li>Click <b>Connect</b> (top left), then <b>Allow</b> Chrome's “access your local network” prompt.</li>
      </ol>
      <p><a href="guide.html">Full setup guide ↗</a></p>
    </div>`;
  } else {
    const lines=state.text.split('\n');
    const cl=state.line-1, cc=state.column;
    $('buf').innerHTML = lines.map((ln,i)=>{
      let tx;
      if(i===cl){ const c=Math.min(cc,ln.length); tx=hl(ln.slice(0,c))+'<span class="caret"></span>'+hl(ln.slice(c)); }
      else tx=hl(ln);
      return `<div class="row${i===cl?' cur':''}"><span class="ln">${i+1}</span><span class="tx">${tx||' '}</span></div>`;
    }).join('');
  }
  // status
  $('status').innerHTML =
    `<span><span class="k">buffer</span> <b>${esc(state.current||'—')}</b>${state.modified?' <span class="m" style="color:var(--warn)">(modified)</span>':''}</span>`+
    `<span><span class="k">L</span><b>${state.line}</b> <span class="k">C</span><b>${state.column}</b></span>`+
    `<span><span class="k">chat</span> <b>${state.chat?'streaming':'idle'}</b></span>`+
    `<span class="k" style="margin-left:auto">${esc(state.cwd)}</span>`;
}
function hl(s){
  let h=esc(s);
  h=h.replace(/\b(fn|let|mut|use|pub|struct|impl|match|for|if|else|return|async|await|def|class|import|from|const)\b/g,'<span class="tok-kw">$1</span>');
  h=h.replace(/(&quot;[^&]*?&quot;)/g,'<span class="tok-str">$1</span>');
  h=h.replace(/(\/\/.*$|;.*$)/g,'<span class="tok-cm">$1</span>');
  return h;
}

// ── editing: keystrokes → eval of Scheme (the daemon owns the buffer) ──
const schemeStr=(s)=>'"'+s.replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n')+'"';
$('buf').addEventListener('keydown',(e)=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){ e.preventDefault(); openPal(); return; }
  if(e.metaKey||e.ctrlKey) return;                 // leave browser shortcuts alone
  let code=null;
  if(e.key.length===1) code=`(buffer-insert ${schemeStr(e.key)})`;
  else if(e.key==='Enter') code='(buffer-insert "\\n")';
  else if(e.key==='Backspace') code='(buffer-delete)';
  else if(e.key==='Tab') code='(buffer-insert "  ")';
  if(code){ e.preventDefault(); evalScheme(code).then(scheduleRefresh); }
});
// click a tab → switch buffer on the daemon
$('tabs').addEventListener('click',(e)=>{ const t=e.target.closest('.tab'); if(!t)return;
  evalScheme(`(buffer-switch ${schemeStr(t.dataset.name)})`).then(scheduleRefresh); });

// ── connect ──
function setDot(on){ $('dot').className='dot'+(on?' on':''); const h=$('hint'); if(h)h.style.display=on?'none':''; }
function setWho(html){ $('who').innerHTML=html; }
$('connect').onclick=()=>{
  const url=$('ws').value.trim();
  try{
    if(socket)socket.close();
    socket=new WebSocket(url); setWho('connecting…'); setDot(false);
    let acc='';
    // UX1: a public https page reaching localhost triggers Chrome's Private
    // Network Access prompt; the socket sits in CONNECTING until the user allows
    // it. Coach that instead of leaving them on a silent "connecting…".
    const pnaCoach=setTimeout(()=>{ if(socket&&socket.readyState===0)
      setWho('connecting… <b style="color:var(--warn)">if this is stuck, click Allow on Chrome\'s “access your local network” prompt.</b>'); },1500);
    socket.onopen=async()=>{
      clearTimeout(pnaCoach);
      setDot(true); setWho('connected — <b>aimax</b> over JSON-RPC');
      await rpc('subscribe',{events:['buffer_changed','buffer_created','buffer_killed','chat_message','process_output','process_exit']}).catch(()=>{});
      refresh(); $('buf').focus();
    };
    socket.onmessage=(ev)=>{ acc+=ev.data; let nl; while((nl=acc.indexOf('\n'))>=0){ const l=acc.slice(0,nl); acc=acc.slice(nl+1); if(l.trim())onLine(l); } if(acc.trim()){ onLine(acc); acc=''; } };
    socket.onclose=()=>{ clearTimeout(pnaCoach); setDot(false); setWho('disconnected');
      state.buffers=[]; state.current=null; render(); }; // back to the not-connected card
    // UX4: endpoint-aware error — the "serve from localhost" hint is only right
    // for a ws:// (localhost-served) page; on wss:// (naklios.dev) the fix is the
    // bridge + the local-network prompt.
    socket.onerror=()=>{ clearTimeout(pnaCoach);
      const wss=url.startsWith('wss://');
      setWho('<span style="color:var(--warn)">connect failed — is the bridge running? '+
        (wss?'and did you Allow the “access local network” prompt?':'(serve this page from localhost)')+'</span>'); };
  }catch(_){ setWho('bad url'); }
};

// ── wire log ──
function logWire(kind,text){ const el=document.createElement('div'); el.className=kind; el.textContent=(kind==='o'?'→ ':kind==='i'?'← ':'• ')+text;
  const L=$('wireList'); L.prepend(el); while(L.children.length>60)L.lastChild.remove(); }
$('wireBtn').onclick=()=>$('wireBox').classList.toggle('show');

// ── palette = the eval method, with a few presets ──
const PRESETS=['(buffer-text)','(buffer-names)','(buffer-create "*notes*")','(buffer-switch "*scratch*")','(buffer-insert "hello")','(buffer-delete)','(buffer-line-count)','(major-mode)'];
let palSel=0, palShown=[];
$('evalBtn').onclick=openPal;
function openPal(){ $('pal').classList.add('show'); const i=$('palInput'); i.value=''; renderPal(''); i.focus(); }
function closePal(){ $('pal').classList.remove('show'); $('buf').focus(); }
function renderPal(q){ palShown=PRESETS.filter(c=>c.toLowerCase().includes(q.toLowerCase().trim())); palSel=0;
  $('palList').innerHTML=palShown.map((c,i)=>`<div class="it${i===0?' sel':''}" data-i="${i}"><span class="k">eval</span> ${esc(c)}</div>`).join('')||'<div class="it" style="color:var(--faint)">↵ evals exactly what you typed</div>'; }
$('palInput').addEventListener('input',e=>renderPal(e.target.value));
$('palInput').addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();closePal();return;}
  if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,Math.max(palShown.length-1,0));markPal();return;}
  if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);markPal();return;}
  if(e.key==='Enter'){e.preventDefault();const code=palShown[palSel]||$('palInput').value.trim();
    if(code) evalScheme(code).then(scheduleRefresh).catch(err=>logWire('e',err.message)); closePal();}
});
function markPal(){[...$('palList').children].forEach((el,i)=>el.classList.toggle('sel',i===palSel));}
$('palList').addEventListener('click',e=>{const it=e.target.closest('.it');if(!it||it.dataset.i==null)return;
  const code=palShown[Number(it.dataset.i)]; if(code)evalScheme(code).then(scheduleRefresh); closePal();});
$('pal').addEventListener('click',e=>{if(e.target.id==='pal')closePal();});

render();

// Endpoint default follows the deployment: from a public https origin
// (naklios.dev) use the loopback-cert host over wss; from a localhost-served
// page use plaintext ws. Editable either way.
try {
  if (location.protocol === 'https:') $('ws').value = 'wss://local.naklios.dev:9130';
} catch (_) {}
</script>
</body>
</html>
